<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Reset Password | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-2xl items-center justify-center">
      <div class="w-full rounded-[1.75rem] bg-white shadow-[0_18px_48px_rgba(15,23,42,0.12)]">
        <div class="px-8 py-10 sm:px-10">
          <div class="mb-8 text-center">
            <img
              class="mx-auto mb-4 h-16 w-auto"
              src="../../assets/images/clinic/Bethlehem_Logo-256.png"
              alt="Bethlehem Animal Clinic Logo"
            />
            <h1 class="text-3xl font-bold leading-tight text-slate-800">Reset Password</h1>
            <p id="resetPasswordAccount" class="mt-4 text-sm leading-6 text-slate-500">Confirming reset link...</p>
          </div>

          <form id="resetPasswordForm" class="hidden space-y-5" autocomplete="off">
            <div>
              <label for="newPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">New password</label>
              <div class="relative">
                <input
                  id="newPassword"
                  name="password"
                  type="password"
                  autocomplete="off"
                  data-lpignore="true"
                  data-1p-ignore="true"
                  class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                  required
                />
                <button id="toggleNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show new password">
                  <svg class="new-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="new-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
            </div>

            <div>
              <label for="confirmNewPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Confirm new password</label>
              <div class="relative">
                <input
                  id="confirmNewPassword"
                  name="password_confirmation"
                  type="password"
                  autocomplete="off"
                  data-lpignore="true"
                  data-1p-ignore="true"
                  class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                  required
                />
                <button id="toggleConfirmNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show password confirmation">
                  <svg class="confirm-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="confirm-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
            </div>

            <button
              id="resetPasswordSubmit"
              type="submit"
              class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70"
            >
              <span id="resetPasswordSubmitLabel">Reset Password</span>
            </button>
          </form>

          <div id="resetPasswordMessage" class="hidden rounded-2xl border px-4 py-3 text-sm" role="alert"></div>

          <div class="mt-7 text-center text-sm">
            <a href="./sign-in.html" class="font-semibold text-[#315b7e] transition hover:text-[#274a66]">Back to Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/api.js?v=chatbot-safety-insights-20260830" defer></script>
    <script src="../../scripts/auth/reset-password.js?v=password-reset-20260828" defer></script>
    <script src="../../scripts/components/home-ai-chatbot.js?v=chatbot-safety-insights-20260830&ui=20260914-icon-only" defer></script>
  </body>
</html>
