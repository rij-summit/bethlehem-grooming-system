<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grooming History | Bethlehem Animal Clinic</title>

    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen flex client-dashboard-shell">

      <!-- Mobile sidebar toggle -->
      <button
        type="button"
        id="clientSidebarToggle"
        class="client-sidebar-toggle"
        aria-controls="clientSidebar"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <button
        type="button"
        id="clientSidebarBackdrop"
        class="client-sidebar-backdrop"
        aria-label="Close navigation menu"
      ></button>

      <!-- ===================================================== -->
      <!-- SIDEBAR -->
      <!-- ===================================================== -->
      <aside
        id="clientSidebar"
        class="client-sidebar fixed left-0 top-0 h-screen w-72 bg-[#7fa2c9] text-white flex flex-col justify-between shadow-lg"
      >
        <div>
          <!-- Clinic Branding -->
          <div class="px-6 py-6">
            <div class="flex items-start justify-between gap-4">
              <a href="./dashboard.html" class="flex items-center gap-3">
                <div class="h-12 w-12 rounded-2xl bg-white p-1.5 flex items-center justify-center">
                  <img
                    src="../../assets/images/clinic/Bethlehem_Logo-256.png"
                    alt="Bethlehem Animal Clinic logo"
                    class="h-full w-full object-contain"
                  />
                </div>
                <div>
                  <h1 class="text-lg font-bold leading-tight">Bethlehem Animal Clinic</h1>
                  <p class="text-sm text-white/80">Client Portal</p>
                </div>
              </a>
              <button
                type="button"
                id="clientSidebarClose"
                class="client-sidebar-close"
                aria-label="Close navigation menu"
              >
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <!-- Navigation -->
          <nav class="px-4 py-6 space-y-2">
            <p class="px-3 mb-2 text-xs tracking-[0.2em] uppercase text-white/70">Menu</p>

            <a
              href="./dashboard.html"
              class="flex items-center gap-3 rounded-2xl px-4 py-3 font-medium hover:bg-white/10 transition"
            >
              <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
              <span>Dashboard</span>
            </a>

            <a
              href="./my-pets.html"
              class="flex items-center gap-3 rounded-2xl px-4 py-3 font-medium hover:bg-white/10 transition"
            >
              <i data-lucide="paw-print" class="w-5 h-5"></i>
              <span>My Pets</span>
            </a>

            <!-- Active page -->
            <a
              href="./grooming-history.html"
              class="flex items-center gap-3 rounded-2xl bg-[#355c84] px-4 py-3 font-medium shadow-sm"
            >
              <i data-lucide="clipboard-list" class="w-5 h-5"></i>
              <span>Grooming History</span>
            </a>

            <a
              href="./settings.html"
              class="flex items-center gap-3 rounded-2xl px-4 py-3 font-medium hover:bg-white/10 transition"
            >
              <i data-lucide="settings" class="w-5 h-5"></i>
              <span>Settings</span>
            </a>
          </nav>
        </div>

        <!-- Client Profile -->
        <div class="p-4">
          <a href="./settings.html" aria-label="View profile settings"
            class="rounded-2xl bg-[#355c84] px-4 py-4 flex items-center gap-3 mb-3 text-white transition hover:bg-[#3f6d9c] focus:outline-none focus:ring-2 focus:ring-white/70">
            <div
              id="clientProfileInitials"
              class="h-12 w-12 rounded-full bg-white/20 flex items-center justify-center font-bold"
            >--</div>
            <div>
              <p id="clientProfileName" class="font-semibold">Loading...</p>
              <p class="text-sm text-white/80">Pet Owner</p>
            </div>
          </a>
          <button
            type="button"
            id="clientLogoutBtn"
            class="flex w-full items-center justify-center gap-2 rounded-2xl border border-white/30 px-4 py-3 font-bold text-white transition hover:bg-white/20"
          >
            <i data-lucide="log-out" class="h-4 w-4"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- ===================================================== -->
      <!-- MAIN CONTENT -->
      <!-- ===================================================== -->
      <main class="client-dashboard-main ml-72 flex-1 min-h-screen">

        <!-- Header -->
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
          <div class="client-dashboard-header flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between px-6 py-5">
            <div>
              <h2 class="text-3xl font-bold text-[#2f4b66]">Grooming History</h2>
              <p class="text-slate-500 mt-1">All your past grooming sessions in one place.</p>
            </div>
            <div class="flex items-center gap-3">
              <a
                href="./booking.html"
                class="flex items-center gap-2 rounded-full bg-[#315b7e] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#274a67] transition"
              >
                <i data-lucide="plus" class="w-4 h-4"></i>
                Pre-register
              </a>
            </div>
          </div>
        </header>

        <!-- Page Body -->
        <section class="px-6 py-8 space-y-6">

          <!-- Filters -->
          <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2.5 flex-1 max-w-sm shadow-sm">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
              <input
                type="text"
                id="historySearch"
                placeholder="Search by reference or pet name..."
                class="w-full bg-transparent outline-none text-sm"
              />
            </div>
            <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2.5 shadow-sm">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400 shrink-0"></i>
              <input
                type="date"
                id="historyDateFilter"
                class="bg-transparent outline-none text-sm text-slate-700"
              />
            </div>
            <button
              type="button"
              id="historyClearFilters"
              class="rounded-full border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-500 hover:bg-slate-50 transition shadow-sm"
            >
              Clear
            </button>
          </div>

          <!-- Summary bar -->
          <div id="historySummary" class="text-sm text-slate-400"></div>

          <!-- History list -->
          <div id="historyList">
            <div class="text-center py-16">
              <i data-lucide="loader" class="w-8 h-8 mx-auto text-slate-300 animate-spin"></i>
              <p class="mt-3 text-slate-400 text-sm">Loading grooming history...</p>
            </div>
          </div>

        </section>
      </main>
    </div>

    <script src="../../scripts/api.js"></script>
    <script>
      lucide.createIcons();

      // ── Sidebar (mobile) ──────────────────────────────────────────────────
      const mobileSidebarQuery = window.matchMedia("(max-width: 1180px)");
      const sidebarToggle   = document.getElementById("clientSidebarToggle");
      const sidebarClose    = document.getElementById("clientSidebarClose");
      const sidebarBackdrop = document.getElementById("clientSidebarBackdrop");
      const sidebar         = document.getElementById("clientSidebar");
      const sidebarLinks    = sidebar.querySelectorAll("a");

      function setSidebarState(isOpen) {
        document.body.classList.toggle("client-sidebar-open", isOpen);
        sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        sidebarToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
      }

      function closeSidebar() { setSidebarState(false); }
      function toggleSidebar() {
        if (!mobileSidebarQuery.matches) return;
        setSidebarState(!document.body.classList.contains("client-sidebar-open"));
      }

      setSidebarState(false);
      sidebarToggle.addEventListener("click", toggleSidebar);
      sidebarClose.addEventListener("click", closeSidebar);
      sidebarBackdrop.addEventListener("click", closeSidebar);
      sidebarLinks.forEach(link => link.addEventListener("click", closeSidebar));
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });
      mobileSidebarQuery.addEventListener("change", e => { if (!e.matches) closeSidebar(); });

      // ── Auth: load profile ────────────────────────────────────────────────
      (async () => {
        try {
          const { user } = await API.getMe("customer");
          const firstName = user.first_name || "";
          const lastName  = user.last_name  || "";
          document.getElementById("clientProfileName").textContent =
            `${firstName} ${lastName}`.trim() || "Customer";
          document.getElementById("clientProfileInitials").textContent =
            ((firstName[0] || "") + (lastName[0] || "")).toUpperCase() || "--";
        } catch {
          window.location.href = "./sign-in.html";
        }
      })();

      document.getElementById("clientLogoutBtn").addEventListener("click", async () => {
        try { await API.logout("customer"); } finally {
          window.location.href = "./sign-in.html";
        }
      });

      // ── Grooming History ──────────────────────────────────────────────────
      const historyList     = document.getElementById("historyList");
      const historySummary  = document.getElementById("historySummary");
      const searchInput     = document.getElementById("historySearch");
      const dateFilter      = document.getElementById("historyDateFilter");
      const clearBtn        = document.getElementById("historyClearFilters");

      let allHistory = [];

      async function loadHistory() {
        try {
          const data  = await API.getBookingHistory();
          allHistory  = data.history || [];
          applyFilters();
        } catch {
          historyList.innerHTML = `
            <div class="text-center py-16">
              <i data-lucide="alert-circle" class="w-10 h-10 mx-auto text-red-300"></i>
              <p class="mt-3 text-red-500 text-sm">Failed to load history. Please refresh.</p>
            </div>`;
          lucide.createIcons();
        }
      }

      function applyFilters() {
        const search = searchInput.value.trim().toLowerCase();
        const date   = dateFilter.value;

        let filtered = allHistory;

        if (search) {
          filtered = filtered.filter(b => {
            const ref  = (b.booking_reference || "").toLowerCase();
            const pets = (b.pets || []).map(p => (p.pet_name || "").toLowerCase()).join(" ");
            return ref.includes(search) || pets.includes(search);
          });
        }

        if (date) {
          filtered = filtered.filter(b => b.booking_date === date);
        }

        renderHistory(filtered);
      }

      function renderHistory(records) {
        historySummary.textContent = records.length
          ? `${records.length} session${records.length !== 1 ? "s" : ""} found`
          : "";

        if (!records.length) {
          historyList.innerHTML = `
            <div class="text-center py-16">
              <i data-lucide="clipboard-x" class="w-12 h-12 mx-auto text-slate-300"></i>
              <p class="mt-4 text-slate-400 text-sm">No grooming sessions found.</p>
            </div>`;
          lucide.createIcons();
          return;
        }

        historyList.innerHTML = `
          <div class="space-y-4">
            ${records.map(b => buildHistoryCard(b)).join("")}
          </div>`;
        lucide.createIcons();
      }

      function buildHistoryCard(b) {
        const timeLabel = b.time_window?.window_label ?? "—";
        const petNames  = (b.pets || []).map(p => p.pet_name).filter(Boolean).join(", ") || "—";
        const breeds    = (b.pets || []).map(p => p.breed).filter(Boolean).join(", ");
        const paidBadge = b.paid
          ? `<span class="rounded-full bg-green-100 px-2.5 py-1 text-[11px] font-semibold text-green-700">Paid ✓</span>`
          : `<span class="rounded-full bg-amber-100 px-2.5 py-1 text-[11px] font-semibold text-amber-700">Unpaid</span>`;

        const droppedOff    = b.dropped_off_at     ? `<span class="text-slate-400">Dropped off:</span> ${b.dropped_off_at}` : null;
        const groomingStart = b.grooming_started_at ? `<span class="text-slate-400">Grooming started:</span> ${b.grooming_started_at}` : null;
        const groomingEnd   = b.grooming_finished_at ? `<span class="text-slate-400">Finished:</span> ${b.grooming_finished_at}` : null;
        const timelineItems = [droppedOff, groomingStart, groomingEnd].filter(Boolean);
        const timeline = timelineItems.length
          ? `<div class="mt-2 flex flex-col gap-0.5 text-xs text-slate-600">
               ${timelineItems.map(item => `<p>${item}</p>`).join("")}
             </div>`
          : "";

        return `
          <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm hover:shadow-md transition">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">

              <!-- Left: booking info -->
              <div class="flex gap-4">
                <div class="h-12 w-12 rounded-2xl bg-[#eaf4fb] flex items-center justify-center shrink-0">
                  <i data-lucide="scissors" class="w-5 h-5 text-[#315b7e]"></i>
                </div>
                <div>
                  <p class="text-sm font-bold text-slate-800">${b.booking_reference}</p>
                  <p class="text-xs text-slate-500 mt-0.5">${formatDate(b.booking_date)} &middot; ${timeLabel}</p>
                  <p class="text-xs text-slate-500 mt-0.5">
                    <span class="font-medium text-slate-700">${petNames}</span>
                    ${breeds ? `<span class="text-slate-400"> &middot; ${breeds}</span>` : ""}
                  </p>
                  <p class="text-xs text-slate-400 mt-0.5">${b.number_of_pets} pet${b.number_of_pets !== 1 ? "s" : ""}</p>
                  ${timeline}
                </div>
              </div>

              <!-- Right: badges -->
              <div class="flex sm:flex-col items-center sm:items-end gap-2 shrink-0">
                ${paidBadge}
                <span class="rounded-full bg-green-50 px-2.5 py-1 text-[11px] font-semibold text-green-600">Completed</span>
              </div>

            </div>
          </div>`;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "—";
        return new Date(dateStr + "T00:00:00").toLocaleDateString("en-PH", {
          year: "numeric", month: "long", day: "numeric",
        });
      }

      // ── Filter events ─────────────────────────────────────────────────────
      searchInput.addEventListener("input", applyFilters);
      dateFilter.addEventListener("change", applyFilters);
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        dateFilter.value  = "";
        applyFilters();
      });

      // ── Boot ──────────────────────────────────────────────────────────────
      loadHistory();
    </script>
  </body>
</html>
