<!doctype html>

  <body class="portal-theme group/portal bg-portal-canvas text-portal-text" data-icon-library="phosphor">

      <!-- Mobile sidebar toggle -->

        type="button"
        id="clientSidebarToggle"

        aria-expanded="false"

      >

                </div>

            </div>
            <div class="flex items-center flex-none gap-4 min-[1181px]:max-[1420px]:ml-auto max-[1180px]:flex-wrap max-[639px]:gap-2.5">

                <svg class="ph-icon w-4 h-4 shrink-0 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#magnifying-glass"></use></svg>

                  aria-controls="notifDropdown" aria-expanded="false">
                  <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#bell"></use></svg>
                  <span id="notifBadge" class="absolute -right-1 -top-1 hidden min-h-5 min-w-5 items-center justify-center rounded-full bg-portal-danger px-1 text-[10px] font-bold text-white"></span>
                </button>

                <div id="notifDropdown" class="notif-client-dropdown !rounded-2xl !border-portal-border !shadow-portal-dropdown" style="display:none">
                  <div class="flex shrink-0 items-center justify-between border-b border-slate-100 px-4 py-3">
                    <span class="text-sm font-semibold text-portal-text">Notifications</span>
                    <button type="button" id="notifMarkAllRead" class="text-xs text-portal-primary hover:underline">Mark all as read</button>

              <a id="preRegisterButton" data-pre-registration-button href="./pre-register.html"

        <!-- Page Body -->
        <section class="p-6 pb-[104px] max-[639px]:p-4 max-[639px]:pb-[100px] space-y-6">

          <div id="historyLoadingScreen" class="flex min-h-[60vh] items-center justify-center text-center" role="status" aria-live="polite">
            <div class="flex flex-col items-center">
              <svg class="ph-icon h-9 w-9 animate-spin text-portal-muted-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#spinner-gap"></use></svg>
              <p class="mt-3 text-sm text-portal-muted">Loading grooming history...</p>
            </div>
          </div>
          <div id="historyContent" class="hidden space-y-6" inert aria-hidden="true">

          <!-- Filters -->
          <div class="flex flex-col gap-3 sm:flex-row">
            <div class="flex h-10 items-center gap-2 rounded-xl border border-portal-border bg-white px-4 shadow-sm">
              <svg class="ph-icon h-4 w-4 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#calendar-check"></use></svg>
              <input
                type="date"
                id="historyDateFilter"
                class="h-full min-w-0 bg-transparent outline-none text-sm text-portal-text"
              />
            </div>
            <button
              type="button"
              id="historyClearFilters"
              class="h-10 rounded-xl border border-portal-border bg-white px-4 py-2 text-sm font-semibold text-portal-text shadow-sm transition hover:bg-portal-surface-soft"
            >
              Clear
            </button>
          </div>

          <!-- Summary bar -->
          <div id="historySummary" class="text-sm text-slate-400"></div>

          <!-- History list -->
          <div id="historyList"></div>

          </div>

        </section>

    <div id="historyModal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 sm:p-6" aria-hidden="true">
      <div data-history-modal-backdrop class="absolute inset-0 bg-[rgba(31,50,69,0.5)]"></div>
      <section id="historyModalDialog" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle" tabindex="-1"
        class="relative flex max-h-[90vh] w-full max-w-[760px] flex-col overflow-hidden rounded-2xl border border-portal-border bg-white shadow-portal-dropdown">
        <div class="flex items-start justify-between gap-4 border-b border-portal-border px-5 py-4 sm:px-6">
          <h2 id="historyModalTitle" class="text-xl font-bold text-portal-text">Grooming Session Details</h2>
          <button type="button" data-history-modal-close aria-label="Close grooming session details"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-portal-muted transition hover:bg-portal-active hover:text-portal-primary">
            <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#x"></use></svg>
          </button>
        </div>
        <div id="historyModalContent" class="min-h-0 overflow-y-auto px-5 py-5 sm:px-6"></div>
        <div class="flex justify-end border-t border-portal-border px-5 py-4 sm:px-6">
          <button type="button" data-history-modal-close class="min-h-10 rounded-xl border border-portal-border bg-portal-surface-soft px-5 py-2 text-sm font-semibold text-portal-primary-hover transition hover:bg-portal-active">Close</button>
        </div>
      </section>
    </div>

    <script src="../../scripts/api.js?v=chatbot-safety-insights-20260830"></script>
    <script>
      function scheduleCustomerHistoryIdleTask(task) {
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(task, { timeout: 1200 });
          return;
        }

        window.setTimeout(task, 200);
      }

      // ── Sidebar (mobile) ──────────────────────────────────────────────────
      const mobileSidebarQuery = window.matchMedia("(max-width: 1180px)");
      const sidebarToggle   = document.getElementById("clientSidebarToggle");
      const sidebarClose    = document.getElementById("clientSidebarClose");
      const sidebarBackdrop = document.getElementById("clientSidebarBackdrop");
      const sidebar         = document.getElementById("clientSidebar");
      const sidebarLinks    = sidebar.querySelectorAll("a");

      function setSidebarState(isOpen) {
        document.body.classList.toggle("client-sidebar-open", isOpen);
        sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        sidebarToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
      }

      function closeSidebar() { setSidebarState(false); }
      function toggleSidebar() {
        if (!mobileSidebarQuery.matches) return;
        setSidebarState(!document.body.classList.contains("client-sidebar-open"));
      }

      setSidebarState(false);
      sidebarToggle.addEventListener("click", toggleSidebar);
      sidebarClose.addEventListener("click", closeSidebar);
      sidebarBackdrop.addEventListener("click", closeSidebar);
      sidebarLinks.forEach(link => link.addEventListener("click", closeSidebar));
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });
      mobileSidebarQuery.addEventListener("change", e => { if (!e.matches) closeSidebar(); });

      // ── Auth: load profile ────────────────────────────────────────────────
      const loadCustomerProfile = async () => {
        try {
          const { user } = await API.getMe("customer");
          const firstName = user.first_name || "";
          const lastName  = user.last_name  || "";
          document.getElementById("clientProfileName").textContent =
            `${firstName} ${lastName}`.trim() || "Customer";
          document.getElementById("clientProfileInitials").textContent =
            ((firstName[0] || "") + (lastName[0] || "")).toUpperCase() || "--";
        } catch (error) {
          if (API.isAuthenticationError(error) || !API.hasAuthenticatedSession("customer")) {
            API.redirectToSignIn();
          } else {
            console.error("Unable to load the customer profile.", error);
          }
        }
      };

      document.getElementById("clientLogoutBtn").addEventListener("click", async () => {
        try { await API.logout("customer"); } finally {
          API.redirectToSignIn({ replace: true });
        }
      });

      // ── Grooming History ──────────────────────────────────────────────────
      const historyList     = document.getElementById("historyList");
      const historyLoadingScreen = document.getElementById("historyLoadingScreen");
      const historyContent = document.getElementById("historyContent");
      const historySummary  = document.getElementById("historySummary");
      const searchInput     = document.getElementById("historySearch");
      const dateFilter      = document.getElementById("historyDateFilter");
      const clearBtn        = document.getElementById("historyClearFilters");

      let allHistory = [];
      let historyLoadState = "idle";
      let historyLoadPromise = null;

      function showHistoryContent() {
        historyLoadingScreen.classList.add("hidden");
        historyContent.classList.remove("hidden");
        historyContent.removeAttribute("inert");
        historyContent.removeAttribute("aria-hidden");
      }

      function loadHistory() {
        if (historyLoadState === "loaded") return Promise.resolve(allHistory);
        if (historyLoadPromise) return historyLoadPromise;

        historyLoadState = "loading";
        historyLoadPromise = (async () => {
          try {
            const data = await API.getBookingHistory();
            allHistory = data.history || [];
            historyLoadState = "loaded";
            applyFilters();
            showHistoryContent();
            return allHistory;
          } catch {
            historyLoadState = "error";
            historyList.innerHTML = `
              <div class="text-center py-16">
                <svg class="w-10 h-10 mx-auto fill-current text-red-300" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#warning-circle"></use></svg>
                <p class="mt-3 text-red-500 text-sm">Failed to load history. Please refresh.</p>
              </div>`;
            showHistoryContent();
            return [];
          } finally {
            historyLoadPromise = null;
          }
        })();

        return historyLoadPromise;
      }

      function applyFilters() {
        const search = searchInput.value.trim().toLowerCase();
        const date   = dateFilter.value;

        let filtered = allHistory;

        if (search) {
          filtered = filtered.filter(b => {
            const ref  = (b.booking_reference || "").toLowerCase();
            const pets = (b.pets || []).map(p => (p.pet_name || "").toLowerCase()).join(" ");
            return ref.includes(search) || pets.includes(search);
          });
        }

        if (date) {
          filtered = filtered.filter(b => b.booking_date === date);
        }

        renderHistory(filtered);
      }

      function renderHistory(records) {
        historySummary.textContent = records.length
          ? `${records.length} session${records.length !== 1 ? "s" : ""} found`
          : "";

        if (!records.length) {
          historyList.innerHTML = `
            <div class="text-center py-16">
              <svg class="w-12 h-12 mx-auto fill-current text-slate-300" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#clipboard-text"></use></svg>
              <p class="mt-4 text-slate-400 text-sm">No grooming sessions found.</p>
            </div>`;
          return;
        }

        const search = searchInput.value.trim().toLowerCase();
        const cards = records.flatMap((booking) => {
          const pets = Array.isArray(booking.pets) ? booking.pets : [];
          const visiblePets = search && !String(booking.booking_reference || "").toLowerCase().includes(search)
            ? pets.filter((pet) => String(pet.pet_name || "").toLowerCase().includes(search))
            : pets;
          return (visiblePets.length ? visiblePets : [null]).map((pet) => buildHistoryCard(booking, pet));
        });

        historyList.innerHTML = `
          <div class="space-y-3">
            ${cards.join("")}
          </div>`;
      }

      function escapeHistoryHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function historyDateTimeParts(timestamp) {
        if (!timestamp) return null;
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return null;
        const timeZone = "Asia/Manila";
        return {
          date: new Intl.DateTimeFormat("en-PH", { timeZone, month: "short", day: "numeric", year: "numeric" }).format(date),
          time: new Intl.DateTimeFormat("en-PH", { timeZone, hour: "numeric", minute: "2-digit", hour12: true }).format(date),
        };
      }

      function historyDateTime(timestamp) {
        const parts = historyDateTimeParts(timestamp);
        return parts ? `${parts.date} &middot; ${parts.time}` : "Not recorded";
      }

      function groomingInterval(startTimestamp, finishTimestamp) {
        const start = historyDateTimeParts(startTimestamp);
        const finish = historyDateTimeParts(finishTimestamp);
        if (start && finish && start.date === finish.date) {
          return `${start.date} &middot; ${start.time}–${finish.time}`;
        }
        if (start && finish) {
          return `${start.date} &middot; ${start.time} to ${finish.date} &middot; ${finish.time}`;
        }
        if (start) return `Started ${start.date} &middot; ${start.time}; finish not recorded`;
        if (finish) return `Finished ${finish.date} &middot; ${finish.time}; start not recorded`;
        return "Times not recorded";
      }

      function groomingOutcome(status) {
        const outcomes = {
          stopped: ["Grooming stopped", "bg-red-50 text-red-700"],
          referred_to_clinic: ["Referred to clinic", "bg-violet-50 text-violet-700"],
          paused: ["Grooming paused", "bg-amber-50 text-amber-800"],
        };
        return outcomes[status] || ["Completed", "bg-emerald-50 text-emerald-700"];
      }

      function historyPetIcon(pet) {
        const species = String(pet?.species || "").toLowerCase();
        return species === "dog" ? "dog" : species === "cat" ? "cat" : "paw-print";
      }

      function petGroomingTimes(booking, pet) {
        const useBookingTimes = !pet || Number(booking.number_of_pets) === 1;
        return {
          start: pet?.grooming_started_timestamp || (useBookingTimes ? booking.grooming_started_timestamp : null),
          finish: pet?.grooming_finished_timestamp || (useBookingTimes ? booking.grooming_finished_timestamp : null),
        };
      }

      // Grooming-history card typography and spacing are controlled by the Tailwind classes below.
      function buildHistoryCard(booking, pet) {
        const [outcomeLabel, outcomeClasses] = groomingOutcome(pet?.grooming_status);
        const petName = escapeHistoryHtml(pet?.pet_name || "Pet name not recorded");
        const breed = pet?.breed && pet.breed !== "—" ? escapeHistoryHtml(pet.breed) : "Breed not recorded";
        const species = pet?.species ? escapeHistoryHtml(String(pet.species).replace(/\b\w/g, (letter) => letter.toUpperCase())) : "Species not recorded";
        const petIcon = historyPetIcon(pet);
        const groomingTimes = petGroomingTimes(booking, pet);

        return `
          <article class="portal-card grid grid-cols-1 items-center gap-4 p-4 md:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)_auto]">
            <div class="flex min-w-0 items-center gap-4">
              <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-portal-icon-surface text-portal-primary" aria-hidden="true">
                <svg class="ph-icon h-7 w-7" viewBox="0 0 256 256" focusable="false"><use href="../../assets/icons/phosphor.svg#${petIcon}"></use></svg>
              </span>
              <div class="min-w-0">
                <h3 class="break-words text-xl font-bold leading-tight text-portal-text">${petName}</h3>
                <p class="mt-1 break-words text-xs font-medium text-portal-muted">${breed} &middot; ${species}</p>
              </div>
            </div>

            <div class="min-w-0 space-y-2">
              <p class="flex items-start gap-2.5 text-xs font-medium leading-5 text-portal-text">
                <svg class="ph-icon mt-0.5 h-4 w-4 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#clock-counter-clockwise"></use></svg>
                <span><span class="font-semibold">Dropped off:</span> ${historyDateTime(booking.dropped_off_timestamp)}</span>
              </p>
              <p class="flex items-start gap-2.5 text-xs font-medium leading-5 text-portal-text">
                <svg class="ph-icon mt-0.5 h-4 w-4 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#calendar-check"></use></svg>
                <span><span class="font-semibold">Grooming:</span> ${groomingInterval(groomingTimes.start, groomingTimes.finish)}</span>
              </p>
            </div>

            <div class="flex shrink-0 items-center gap-2 md:flex-col md:items-end">
              <span class="w-fit rounded-full px-3 py-1 text-xs font-semibold ${outcomeClasses}">${outcomeLabel}</span>
              <button type="button" data-history-open data-booking-id="${escapeHistoryHtml(booking.booking_id)}" data-booking-pet-id="${escapeHistoryHtml(pet?.booking_pet_id || "")}" aria-label="See grooming session details for ${petName}"
                class="flex min-h-10 w-fit items-center gap-2 rounded-xl border border-portal-border bg-white px-3 py-2 text-xs font-semibold text-portal-primary-hover transition hover:bg-portal-surface-soft">
                See more <svg class="ph-icon h-3.5 w-3.5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#caret-right"></use></svg>
              </button>
            </div>
          </article>`;
      }

      const historyModal = document.getElementById("historyModal");
      const historyModalDialog = document.getElementById("historyModalDialog");
      const historyModalContent = document.getElementById("historyModalContent");
      let historyModalTrigger = null;

      function historySizeLabel(size) {
        const normalized = String(size || "").trim().toLowerCase();
        if (!normalized) return "Not recorded";
        return normalized.replaceAll("_", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function historyPeso(value) {
        if (value === null || value === undefined || value === "" || !Number.isFinite(Number(value))) {
          return "Not recorded";
        }
        return new Intl.NumberFormat("en-PH", { style: "currency", currency: "PHP" }).format(Number(value));
      }

      function historyServiceGroup(title, lines) {
        if (!lines.length) return "";
        return `
          <div class="border-b border-portal-border px-4 py-3 last:border-b-0">
            <h4 class="text-[13px] font-semibold text-portal-text">${title}</h4>
            <div class="mt-2 space-y-2">
              ${lines.map((line) => `
                <div class="flex items-start justify-between gap-4 text-xs text-portal-text">
                  <span class="min-w-0 break-words">${escapeHistoryHtml(line.label || "Grooming service")}</span>
                  <span class="shrink-0 font-semibold">${historyPeso(line.price_at_booking)}</span>
                </div>
              `).join("")}
            </div>
          </div>`;
      }

      function buildHistoryModalContent(booking, pet) {
        const [outcomeLabel, outcomeClasses] = groomingOutcome(pet?.grooming_status);
        const petName = escapeHistoryHtml(pet?.pet_name || "Pet name not recorded");
        const breed = pet?.breed && pet.breed !== "—" ? escapeHistoryHtml(pet.breed) : "Breed not recorded";
        const species = pet?.species ? escapeHistoryHtml(String(pet.species).replace(/\b\w/g, (letter) => letter.toUpperCase())) : "Species not recorded";
        const groomingTimes = petGroomingTimes(booking, pet);
        const registeredSize = String(pet?.registered_size || "").trim().toLowerCase();
        const confirmedSize = String(pet?.confirmed_size || "").trim().toLowerCase();
        const sizeChanged = registeredSize && confirmedSize && registeredSize !== confirmedSize;
        const sizeValue = historySizeLabel(pet?.confirmed_size || pet?.size);
        const weight = pet?.weight === null || pet?.weight === undefined || pet?.weight === "" || !Number.isFinite(Number(pet.weight))
          ? "Not recorded"
          : `${new Intl.NumberFormat("en-PH", { maximumFractionDigits: 2 }).format(Number(pet.weight))} kg`;
        const paymentSummary = booking.paid && booking.payment_summary?.status === "paid"
          ? booking.payment_summary : null;
        const settledPet = paymentSummary?.pets?.find((item) =>
          Number(item.booking_pet_id) === Number(pet?.booking_pet_id),
        ) || (Number(booking.number_of_pets) === 1 ? paymentSummary?.pets?.[0] : null);
        const settledLines = Array.isArray(settledPet?.service_breakdown)
          ? settledPet.service_breakdown : [];
        const mainLines = settledLines.filter((line) => line.service_kind === "package");
        const alaCarteLines = settledLines.filter((line) => line.service_kind !== "package");
        const reviewedAdjustment = Number(settledPet?.adjustment || 0);
        const arrivalWindow = escapeHistoryHtml(booking.time_window?.window_label || "Not recorded");

        return `
          <div class="flex items-center gap-4">
            <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-portal-icon-surface text-portal-primary" aria-hidden="true">
              <svg class="ph-icon h-7 w-7" viewBox="0 0 256 256" focusable="false"><use href="../../assets/icons/phosphor.svg#${historyPetIcon(pet)}"></use></svg>
            </span>
            <div class="min-w-0 flex-1">
              <h3 class="break-words text-xl font-bold leading-tight text-portal-text">${petName}</h3>
              <p class="mt-1 break-words text-xs font-medium text-portal-muted">Booking ID: ${escapeHistoryHtml(booking.booking_reference || "Not recorded")}</p>
            </div>
            <span class="w-fit shrink-0 rounded-full px-3 py-1 text-xs font-semibold ${outcomeClasses}">${outcomeLabel}</span>
          </div>

          <div class="mt-6 grid gap-6 sm:grid-cols-2 sm:gap-8">
            <section class="min-w-0 pl-4">
              <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
                <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#calendar-check"></use></svg>
                Schedule Information
              </h3>
              <dl class="mt-4 space-y-3">
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Dropped off</dt><dd class="font-medium text-portal-text">${historyDateTime(booking.dropped_off_timestamp)}</dd></div>
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Grooming</dt><dd class="font-medium text-portal-text">${groomingInterval(groomingTimes.start, groomingTimes.finish)}</dd></div>
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Arrival Window</dt><dd class="font-medium text-portal-text">${arrivalWindow}</dd></div>
              </dl>
            </section>

            <section class="min-w-0 sm:border-l sm:border-portal-border sm:pl-8">
              <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
                <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#paw-print"></use></svg>
                Pet Information
              </h3>
              <dl class="mt-4 space-y-3">
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Pet Type</dt><dd class="font-medium text-portal-text">${breed} &middot; ${species}</dd></div>
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs">
                  <dt class="font-medium text-portal-muted">Pet Size</dt>
                  <dd class="font-medium text-portal-text">
                    <span>${escapeHistoryHtml(sizeValue)}</span>
                    ${sizeChanged ? `
                      <span class="ml-1 inline-flex align-middle text-portal-primary" title="Clinic size changed from ${escapeHistoryHtml(historySizeLabel(registeredSize))} to ${escapeHistoryHtml(sizeValue)}">
                        <svg class="ph-icon h-3.5 w-3.5" viewBox="0 0 256 256" aria-label="Clinic-confirmed pet size" focusable="false"><use href="../../assets/icons/phosphor.svg#check-circle"></use></svg>
                      </span>
                      <span class="mt-1 block text-xs text-portal-muted">Size confirmed by Bethlehem Animal Clinic Grooming</span>
                    ` : ""}
                  </dd>
                </div>
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Weight</dt><dd class="font-medium text-portal-text">${escapeHistoryHtml(weight)}</dd></div>
              </dl>
            </section>
          </div>

          <section class="mt-6 rounded-2xl border border-portal-border bg-portal-surface-soft p-4">
            <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
              <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#scissors"></use></svg>
              Services Availed
            </h3>
            ${settledPet ? `
              <div class="mt-4 overflow-hidden rounded-xl border border-portal-border bg-white">
                ${historyServiceGroup("Main Service", mainLines)}
                ${historyServiceGroup("A La Carte", alaCarteLines)}
                ${settledLines.length ? "" : '<p class="px-4 py-3 text-xs text-portal-muted">No services were recorded.</p>'}
                ${reviewedAdjustment ? `<div class="flex justify-between gap-4 border-b border-portal-border px-4 py-3 text-xs text-portal-text"><span>Reviewed adjustment</span><span class="font-semibold">${reviewedAdjustment > 0 ? "−" : "+"}${historyPeso(Math.abs(reviewedAdjustment))}</span></div>` : ""}
                <div class="flex justify-between gap-4 border-b border-portal-border px-4 py-3">
                  <span class="text-[13px] font-semibold text-portal-text">Payment Method</span>
                  <span class="text-xs font-medium text-portal-text">${escapeHistoryHtml(paymentSummary.payment_method_label || "Not recorded")}</span>
                </div>
                <div class="flex justify-between gap-4 bg-portal-active px-4 py-3 text-sm font-bold text-portal-text">
                  <span>Total</span><span>${historyPeso(settledPet.final_pet_charge)}</span>
                </div>
              </div>
            ` : `
              <div class="mt-4 rounded-xl border border-portal-border bg-white p-4">
                <p class="text-xs font-medium text-portal-muted">Final service prices and payment were not recorded for this session.</p>
                ${Array.isArray(pet?.services) && pet.services.length ? `<p class="mt-2 break-words text-xs text-portal-text">Selected services: ${pet.services.map((service) => escapeHistoryHtml(service.service_name || "")).filter(Boolean).join(", ")}</p>` : ""}
              </div>
            `}
          </section>`;
      }

      function closeHistoryModal() {
        if (historyModal.classList.contains("hidden")) return;
        historyModal.classList.add("hidden");
        historyModal.classList.remove("flex");
        historyModal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("overflow-hidden");
        historyModalTrigger?.focus();
        historyModalTrigger = null;
      }

      function openHistoryModal(booking, pet, trigger) {
        historyModalTrigger = trigger;
        historyModalContent.innerHTML = buildHistoryModalContent(booking, pet);
        historyModal.classList.remove("hidden");
        historyModal.classList.add("flex");
        historyModal.setAttribute("aria-hidden", "false");
        document.body.classList.add("overflow-hidden");
        historyModalDialog.querySelector("[data-history-modal-close]")?.focus();
      }

      historyList.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-history-open]");
        if (!trigger) return;
        const booking = allHistory.find((item) => Number(item.booking_id) === Number(trigger.dataset.bookingId));
        if (!booking) return;
        const pet = (booking.pets || []).find((item) =>
          Number(item.booking_pet_id) === Number(trigger.dataset.bookingPetId),
        ) || null;
        openHistoryModal(booking, pet, trigger);
      });

      historyModal.querySelectorAll("[data-history-modal-close]").forEach((button) =>
        button.addEventListener("click", closeHistoryModal),
      );
      historyModal.querySelector("[data-history-modal-backdrop]")?.addEventListener("click", closeHistoryModal);
      document.addEventListener("keydown", (event) => {
        if (historyModal.classList.contains("hidden")) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeHistoryModal();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = Array.from(historyModalDialog.querySelectorAll("button:not([disabled]), a[href], input:not([disabled])"));
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      });

      // ── Filter events ─────────────────────────────────────────────────────
      searchInput.addEventListener("input", applyFilters);
      dateFilter.addEventListener("change", applyFilters);
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        dateFilter.value  = "";
        applyFilters();
      });

      // ── Boot ──────────────────────────────────────────────────────────────
      void loadHistory();
      window.requestAnimationFrame(() => scheduleCustomerHistoryIdleTask(loadCustomerProfile));
    </script>
    <script src="../../scripts/components/client-notification-ui.js?v=20260915-client-notifications"></script>
    <script type="module" src="../../scripts/components/customer-header-notifications.js?v=20260915-client-notifications"></script>
    <script type="module" src="../../scripts/components/customer-pre-registration-button.js?v=20260915-grooming-history"></script>
    <script src="../../scripts/components/home-ai-chatbot.js?v=chatbot-safety-insights-20260830&ui=20260914-icon-only" defer></script>
  </body>
</html>
