<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Visit - Reason for Visit</title>
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body class="min-h-screen bg-[#f6fafd] text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 lg:px-8">
      <section class="mb-6">
        <a
          href="./booking-pet-details.html?flow=clinic"
          class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          &larr; Back to Pet Information
        </a>
        <div class="mt-4">
          <h1 class="text-3xl font-bold text-[#2f4b66]">Reason for Visit</h1>
        </div>
        <div class="mt-6">
          <div class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500">
            <span>Step 3 of 4</span>
            <span>75% Complete</span>
          </div>
          <div class="h-2 w-full rounded-full bg-slate-200">
            <div class="h-2 rounded-full bg-[#315b7e]" style="width: 75%"></div>
          </div>
        </div>
      </section>

      <section class="rounded-3xl bg-[#cfe3f6] p-6 shadow-lg md:p-8">
        <div class="mx-auto max-w-5xl">
          <div class="mb-6 rounded-2xl border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Patient</p>
            <p id="reasonPetName" class="mt-2 text-sm font-semibold text-[#2f4b66]"></p>
            <p id="reasonPetDetails" class="mt-1 text-sm text-slate-500"></p>
          </div>

          <section class="rounded-3xl bg-white/90 p-5 shadow-sm md:p-6">
            <h2 class="mb-4 text-2xl font-bold text-[#2f4b66]">Tell us why your pet needs a clinic visit</h2>
            <form id="clinicVisitReasonForm" class="space-y-5" novalidate>
              <div>
                <label for="clinicVisitReason" class="mb-2 block text-sm font-medium text-slate-700">
                  Reason for Visit <span class="text-red-500">*</span>
                </label>
                <textarea
                  id="clinicVisitReason"
                  name="chief_complaint"
                  rows="5"
                  maxlength="1000"
                  placeholder="Describe your pet's symptoms or reason for the visit, such as vomiting, limping, or a routine check-up."
                  class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  required
                ></textarea>
                <div class="mt-2 flex items-start justify-between gap-4">
                  <p id="clinicVisitReasonError" class="hidden text-sm text-red-600"></p>
                  <p id="clinicVisitReasonCount" class="ml-auto text-xs text-slate-400">0 / 1000</p>
                </div>
              </div>

              <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <a
                  href="./booking-pet-details.html?flow=clinic"
                  class="inline-flex items-center justify-center rounded-2xl border border-[#315b7e] px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]"
                >
                  Back
                </a>
                <button
                  type="submit"
                  class="inline-flex items-center justify-center rounded-2xl bg-[#315b7e] px-6 py-3 text-sm font-semibold text-white transition hover:bg-[#274864]"
                >
                  Review Clinic Visit
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script src="../../scripts/api.js?v=chatbot-safety-insights-20260830"></script>
    <script type="module" src="../../scripts/components/clinic-visit-reason.js"></script>
    <script src="../../scripts/components/home-ai-chatbot.js?v=chatbot-safety-insights-20260830" defer></script>
  </body>
</html>
