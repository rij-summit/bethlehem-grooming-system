<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Forgot Password | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-2xl items-center justify-center">
      <div class="w-full rounded-[1.75rem] bg-white shadow-[0_18px_48px_rgba(15,23,42,0.12)]">
        <div class="px-8 py-10 sm:px-10">
          <div class="mb-8 text-center">
            <img
              class="mx-auto mb-4 h-16 w-auto"
              src="../../assets/images/clinic/Bethlehem_Logo-256.png"
              alt="Bethlehem Animal Clinic Logo"
            />
            <h1 class="text-3xl font-bold leading-tight text-slate-800">Forgot Password</h1>
            <p class="mt-4 text-sm leading-6 text-slate-500">
              Enter your account email to receive a password reset link.
            </p>
          </div>

          <form id="forgotPasswordForm" class="space-y-5">
            <div>
              <label for="resetEmail" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Email</label>
              <input
                id="resetEmail"
                name="email"
                type="email"
                autocomplete="email"
                class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                required
              />
            </div>

            <div id="forgotPasswordMessage" class="hidden rounded-2xl border px-4 py-3 text-sm" role="status"></div>

            <button
              id="forgotPasswordSubmit"
              type="submit"
              class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70"
            >
              <span id="forgotPasswordSubmitLabel">Send Reset Link</span>
            </button>
          </form>

          <div class="mt-7 text-center text-sm">
            <a href="./sign-in.html" class="font-semibold text-[#315b7e] transition hover:text-[#274a66]">Back to Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/api.js?v=chatbot-safety-insights-20260830" defer></script>
    <script src="../../scripts/auth/forgot-password.js?v=password-reset-20260828" defer></script>
    <script src="../../scripts/components/home-ai-chatbot.js?v=chatbot-safety-insights-20260830&ui=20260914-icon-only" defer></script>
  </body>
</html>
