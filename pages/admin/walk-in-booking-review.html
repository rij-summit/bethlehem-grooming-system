<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk-in Booking - Review</title>
    <link href="../../css/output.css" rel="stylesheet" />
    <link href="../../css/custom.css" rel="stylesheet" />
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 lg:px-8">
      <button
        id="walkInReviewBackTopBtn"
        type="button"
        class="inline-flex items-center gap-2 text-sm font-medium text-[#315b7e] hover:underline"
      >
        <span>&larr;</span>
        <span>Back to Grooming Services</span>
      </button>

      <section class="mt-4">
        <h1 class="text-3xl font-bold text-[#2f4b66]">Review Walk-in Booking</h1>

        <div class="mt-6">
          <div
            class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500"
          >
            <span>Step 4 of 5</span>
            <span>80% Complete</span>
          </div>
          <div class="h-2 w-full rounded-full bg-slate-200">
            <div
              class="h-2 rounded-full bg-[#315b7e]"
              style="width: 80%"
            ></div>
          </div>
        </div>
      </section>

      <section
        class="mt-6 rounded-[28px] border border-slate-200 bg-[#d9e8f4] p-5 shadow-sm md:p-8"
      >
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-[#2f4b66]">Booking Review</h2>
        </div>

        <div class="mb-6 grid gap-4 md:grid-cols-2">
          <div class="rounded-2xl border border-slate-200 bg-white p-4">
            <p
              class="text-xs font-semibold uppercase tracking-wide text-slate-400"
            >
              Booking Type
            </p>
            <p class="mt-2 text-sm text-slate-600">
              Walk-in booking
            </p>
          </div>

          <div class="rounded-2xl border border-slate-200 bg-white p-4">
            <p
              class="text-xs font-semibold uppercase tracking-wide text-slate-400"
            >
              Pet Summary
            </p>
            <p id="petReviewText" class="mt-2 text-sm text-slate-600">
              No pet selected yet.
            </p>
          </div>
        </div>

        <div
          id="reviewNotice"
          class="mb-6 rounded-2xl border border-[#9bb9d3] bg-white px-4 py-3 text-sm text-slate-600"
        >
          Review details will appear here.
        </div>

        <!--
          BACKEND TEAMMATE + CLAUDE CODE:
          The review content is rendered from the frontend draft at the moment.
          Replace it with saved walk-in draft data and backend-priced totals
          once those records are available.
        -->
        <div id="reviewSelections" class="space-y-6"></div>

        <section class="mt-8 rounded-2xl border border-slate-200 bg-white p-5">
          <p
            class="text-xs font-semibold uppercase tracking-wide text-slate-400"
          >
            Price Summary
          </p>
          <h3
            id="totalPriceHeading"
            class="mt-3 text-2xl font-bold text-[#2f4b66]"
          >
            Total Price
          </h3>
          <p id="totalPriceText" class="mt-2 text-3xl font-bold text-[#244764]">
            P0
          </p>
          <p id="totalPriceSubtext" class="mt-3 text-sm text-slate-500">
            Pricing details will appear once services are selected.
          </p>
        </section>

        <div
          id="reviewActionNotice"
          class="mt-6 hidden rounded-2xl border px-4 py-3 text-sm"
        ></div>

        <div
          class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
        >
          <button
            id="walkInReviewBackBtn"
            type="button"
            class="inline-flex items-center justify-center rounded-xl border border-[#315b7e] px-5 py-3 text-sm font-medium text-[#315b7e] transition hover:bg-white"
          >
            Back
          </button>

          <button
            id="confirmBookingBtn"
            type="button"
            class="inline-flex items-center justify-center rounded-xl bg-[#315b7e] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#274a67]"
          >
            Next Step
          </button>
        </div>
      </section>
    </main>

    <script src="../../scripts/api.js"></script>
    <script
      type="module"
      src="../../scripts/components/walk-in-review-step.js"
    ></script>
  </body>
</html>
