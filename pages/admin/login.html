<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-9 py-10">
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800">Admin Login</h1>
        <p class="text-sm text-gray-500 mt-2">Authorized personnel only.</p>
      </div>

      <form id="adminLoginForm" class="space-y-5">
        <div>
          <label
            for="adminEmail"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Admin Email
          </label>
          <input
            id="adminEmail"
            type="email"
            placeholder="Enter admin email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#315b7e]"
            required
          />
        </div>

        <div>
          <label
            for="adminPassword"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Password
          </label>
          <input
            id="adminPassword"
            type="password"
            placeholder="Enter password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#315b7e]"
            required
          />
        </div>

        <button
          type="submit"
          class="w-full bg-[#315b7e] text-white py-3 rounded-xl font-semibold hover:bg-[#254561] transition-colors"
        >
          Log In as Admin
        </button>
      </form>

      <div class="mt-6 text-center">
        <a
          href="../../index.html"
          class="text-sm text-gray-500 hover:text-[#315b7e]"
        >
          ← Back to Home
        </a>
      </div>
    </div>

    <script src="../../scripts/main.js"></script>
  </body>
</html>
