<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk-in Booking - Owner Information</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="min-h-screen bg-[#f6fafd] text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 lg:px-8">
      <section class="mb-6">
        <a
          href="./appointments.html"
          class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          <span>&larr;</span>
          <span>Back</span>
        </a>

        <div class="mt-4">
          <h1 class="text-3xl font-bold text-[#2f4b66]">
            Enter your Personal Information
          </h1>
        </div>

        <div class="mt-4">
          <p class="mb-2 text-sm font-semibold text-slate-600">Walk-in Type</p>
          <div class="flex gap-3">
            <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-[#315b7e] bg-white px-4 py-2.5 text-sm font-semibold text-[#315b7e] has-[:checked]:bg-[#315b7e] has-[:checked]:text-white transition">
              <input type="radio" name="appointmentType" id="typeGrooming" value="grooming" class="sr-only" checked />
              Grooming
            </label>
            <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-[#315b7e] bg-white px-4 py-2.5 text-sm font-semibold text-[#315b7e] has-[:checked]:bg-[#315b7e] has-[:checked]:text-white transition">
              <input type="radio" name="appointmentType" id="typeClinic" value="clinic" class="sr-only" />
              Clinic Visit
            </label>
          </div>
        </div>

        <div class="mt-6">
          <div
            class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500"
          >
            <span>Step 1 of 5</span>
            <span>20% Complete</span>
          </div>
          <div class="h-2 w-full rounded-full bg-slate-200">
            <div
              class="h-2 rounded-full bg-[#315b7e]"
              style="width: 20%"
            ></div>
          </div>
        </div>
      </section>

      <section class="rounded-3xl bg-[#cfe3f6] p-6 shadow-lg md:p-8">
        <div class="mx-auto max-w-5xl">
          <section class="rounded-3xl bg-white/90 p-5 shadow-sm md:p-6">
            <div class="mb-6">
              <h2 class="text-2xl font-bold text-[#2f4b66]">
                Owner Information
              </h2>
            </div>

            <!--
              BACKEND TEAMMATE + CLAUDE CODE:
              This owner form is currently frontend-only. The JS stores a
              browser draft; connect these fields to the walk-in draft/customer
              save flow when the backend endpoint is available.
            -->
            <form id="walkInOwnerForm" class="space-y-5" novalidate>
              <div class="grid gap-5 md:grid-cols-2">
                <div>
                  <label
                    for="ownerFirstName"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    First Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="ownerFirstName"
                    name="first_name"
                    type="text"
                    autocomplete="given-name"
                    maxlength="100"
                    placeholder="Enter first name"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    required
                  />
                  <p id="ownerFirstNameError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="ownerLastName"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Last Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="ownerLastName"
                    name="last_name"
                    type="text"
                    autocomplete="family-name"
                    maxlength="100"
                    placeholder="Enter last name"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    required
                  />
                  <p id="ownerLastNameError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="ownerMiddleInitial"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Middle Initial (optional)
                  </label>
                  <input
                    id="ownerMiddleInitial"
                    name="middle_initial"
                    type="text"
                    autocomplete="additional-name"
                    maxlength="5"
                    placeholder="A"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  />
                </div>

                <div>
                  <label
                    for="ownerPhoneNumber"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Phone Number (11-digits) <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="ownerPhoneNumber"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    maxlength="20"
                    placeholder="09XX XXX XXXX"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    required
                  />
                  <p id="ownerPhoneNumberError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div class="md:col-span-2">
                  <label
                    for="ownerEmailAddress"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Email Address (optional)
                  </label>
                  <input
                    id="ownerEmailAddress"
                    name="email"
                    type="email"
                    autocomplete="email"
                    maxlength="150"
                    placeholder="juanDelaCruz@gmail.com"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    />
                  <p id="ownerEmailAddressError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>
              </div>

              <div
                id="walkInOwnerMessage"
                class="hidden rounded-2xl border px-4 py-3 text-sm"
                role="status"
                aria-live="polite"
              ></div>

              <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <a
                  href="./appointments.html"
                  class="inline-flex items-center justify-center rounded-2xl border border-[#315b7e] px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]"
                >
                  Back
                </a>

                <button
                  id="walkInOwnerNextBtn"
                  type="submit"
                  disabled
                  class="inline-flex cursor-not-allowed items-center justify-center gap-2 rounded-2xl bg-[#315b7e] px-6 py-3 text-sm font-semibold text-white opacity-50 transition hover:bg-[#274864]"
                >
                  <span>Next Step</span>
                  <i data-lucide="arrow-right" class="h-4 w-4"></i>
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script src="../../scripts/api.js?v=email-verification-20260726"></script>
    <script
      type="module"
      src="../../scripts/components/walk-in-owner-step.js"
    ></script>
  </body>
</html>
