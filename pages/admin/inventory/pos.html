<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../../css/output.css" />
    <link rel="stylesheet" href="../../../css/custom.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#f5f8fb] text-slate-800">
    <div x-data="adminSidebar()" class="min-h-screen flex bg-[#f5f8fb]">
      <div x-show="sidebarOpen" x-transition.opacity class="fixed inset-0 z-40 bg-slate-900/40 lg:hidden" @click="sidebarOpen = false"></div>
      <aside class="admin-sidebar-menu fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-[#d7e3ef] bg-[#a9bfd6] shadow-xl transition-transform duration-300 lg:translate-x-0" :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
        <div class="px-6 py-6"><div class="flex items-start gap-4"><div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white p-1.5 shadow-sm"><img src="../../../assets/images/clinic/Bethlehem_Logo.png" alt="logo" class="h-full w-full object-contain" /></div><div class="min-w-0"><h1 class="text-xl font-extrabold leading-tight text-[#1f3850]">Bethlehem Animal</h1><p class="text-sm font-medium text-[#355674]">Clinic &amp; Grooming</p></div></div></div>
        <nav class="px-4 py-6">
          <div class="mb-8"><p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Main</p><div class="space-y-1.5">
            <a href="../dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'dashboard' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="layout-dashboard" class="h-5 w-5"></i><span>Dashboard</span></a>
            <a href="../clients.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'customers' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="users" class="h-5 w-5"></i><span>Customers</span></a>
            <a href="../appointments.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'appointments' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="calendar-days" class="h-5 w-5"></i><span>Schedules</span><span x-show="hasIncomingAppointments" style="display:none" class="ml-auto h-2.5 w-2.5 rounded-full bg-red-500"></span></a>
            <a href="../clinic.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'clinic' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="stethoscope" class="h-5 w-5"></i><span>Clinic</span></a>
            <a href="./inventory-dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'inventory' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="box" class="h-5 w-5"></i><span>Inventory</span></a>
          </div></div>
          <div class="mb-8"><p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Records</p><div class="space-y-1.5">
            <a href="../archive.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'archive' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="archive" class="h-5 w-5"></i><span>Archive</span></a>
            <a href="../transactions.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'transactions' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="receipt" class="h-5 w-5"></i><span>Transactions</span></a>
            <a href="../reports.html" x-show="isAdmin" style="display:none" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'reports' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="clipboard-list" class="h-5 w-5"></i><span>Reports</span></a>
          </div></div>
          <div x-show="isAdmin"><p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">System</p><div class="space-y-1.5"><a href="../settings.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'settings' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'"><i data-lucide="settings" class="h-5 w-5"></i><span>Settings</span></a></div></div>
        </nav>
        <div class="admin-sidebar-footer p-4">
          <div class="mb-4 flex items-center gap-3 rounded-2xl bg-[#355c84] p-3"><div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-sm font-extrabold text-white" x-text="isAdmin ? 'AD' : 'ST'">AD</div><div class="min-w-0"><p class="truncate font-bold text-white" x-text="isAdmin ? 'Admin' : 'Staff'">Admin</p><p class="truncate text-sm text-white/80" x-text="isAdmin ? 'Clinic Manager' : 'Receptionist'">Clinic Manager</p></div></div>
          <button type="button" x-show="isAdmin" @click="handleStopReceivingClick()" class="mb-2 flex w-full items-center justify-center gap-2 rounded-2xl px-4 py-3 font-bold transition" :class="clinicStopped ? 'btn-clinic-reopen' : 'btn-clinic-stop'"><i data-lucide="door-closed" class="h-4 w-4 shrink-0"></i><span x-text="clinicStopped ? 'Reopen Today' : 'We\'re Done for Today'"></span></button>
          <button type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-[#6e8ba8] px-4 py-3 font-bold text-[#1f3850] transition hover:bg-white/30" @click="handleLogout()"><i data-lucide="log-out" class="h-4 w-4"></i><span>Logout</span></button>
        </div>
      </aside>
      <div x-show="stopModal.open" x-transition class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 px-4"><div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl overflow-hidden"><div class="px-6 py-5"><h4 class="text-lg font-bold text-slate-800" x-text="stopModal.title"></h4><p class="mt-2 text-sm text-slate-600" x-text="stopModal.message"></p><p x-show="stopModal.error" class="mt-2 text-sm text-red-600" x-text="stopModal.error"></p></div><div class="flex gap-3 px-6 py-4"><button type="button" @click="stopModal.open = false" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button><button type="button" @click="executeStopReceiving()" :disabled="stopModal.busy" class="flex-1 rounded-xl px-4 py-2 text-sm font-semibold transition" :class="clinicStopped ? 'btn-confirm-reopen' : 'btn-confirm-stop'"><span x-text="stopModal.busy ? 'Please wait...' : stopModal.confirmLabel"></span></button></div></div></div>

      <!-- Main -->
      <div class="flex min-h-screen flex-1 flex-col lg:ml-[280px]">
        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-[#d7e3ef] bg-[#f5f8fb]/90 px-4 py-4 backdrop-blur lg:hidden">
          <div><p class="text-sm font-semibold text-[#5c7690]">Inventory</p><h2 class="text-lg font-extrabold text-[#1f3850]">POS</h2></div>
          <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-[#c9d9e8] bg-white text-[#315b7e] shadow-sm" @click="sidebarOpen = true"><i data-lucide="menu" class="h-5 w-5"></i></button>
        </header>

        <main x-data="adminPos()" class="flex-1 px-4 py-6 lg:px-6 lg:pt-0">
          <section class="lg:sticky lg:top-0 lg:z-30 lg:-mx-6 lg:bg-[#f5f8fb]/95 lg:px-6 lg:py-6 lg:backdrop-blur">
            <div class="rounded-[28px] border border-[#cfe0ee] bg-[#a9bfd6] px-4 py-5 lg:px-6 lg:py-6">
              <div class="flex flex-col gap-5 xl:flex-row xl:items-center xl:justify-between">
                <div>
                  <h2 class="text-3xl font-extrabold text-[#1f3850] lg:text-4xl">Point of Sale</h2>
                  <p class="mt-1 text-xs font-medium tracking-[0.18em] text-[#355674]">Process a retail sale</p>
                </div>
                <a href="./inventory-dashboard.html" class="inline-flex items-center gap-2 rounded-xl border border-[#6e8ba8] bg-white/50 px-4 py-3 text-sm font-semibold text-[#1f3850] transition hover:bg-white/80 self-start"><i data-lucide="arrow-left" class="h-4 w-4"></i><span>Back</span></a>
              </div>
            </div>
          </section>

          <div class="mt-6 grid gap-6 lg:grid-cols-[1fr_360px]">
            <!-- Left: Search + Cart -->
            <div class="space-y-4">
              <!-- Item search -->
              <div class="rounded-2xl border border-[#e6eef7] bg-white p-4 shadow-sm">
                <label class="block text-sm font-bold text-slate-700 mb-2">Add Item</label>
                <div class="relative">
                  <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                  <input x-model="searchQuery" @input="onSearchInput()" type="search" placeholder="Search by name or scan barcode…" class="w-full rounded-xl border border-slate-200 py-2.5 pl-9 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
                  <div x-show="searchResults.length > 0" class="absolute z-10 mt-1 w-full rounded-2xl border border-[#d7e3ef] bg-white shadow-lg overflow-hidden">
                    <template x-for="item in searchResults" :key="item.item_id">
                      <button type="button" @click="addToCart(item)" class="flex w-full items-center justify-between px-4 py-3 text-sm hover:bg-[#eaf4fb]">
                        <span class="font-semibold text-slate-800" x-text="item.item_name"></span>
                        <span class="text-xs text-slate-500">₱<span x-text="parseFloat(item.selling_price ?? 0).toFixed(2)"></span> &middot; <span x-text="item.quantity_on_hand"></span> <span x-text="item.unit"></span></span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Cart -->
              <div class="rounded-2xl border border-[#e6eef7] bg-white shadow-sm overflow-hidden">
                <div class="flex items-center justify-between px-5 py-4 border-b border-[#e6eef7]">
                  <h3 class="font-bold text-slate-800">Cart</h3>
                  <button type="button" @click="clearCart()" x-show="cart.length > 0" class="text-xs font-semibold text-red-500 hover:text-red-700">Clear All</button>
                </div>
                <template x-if="cart.length === 0">
                  <p class="px-5 py-10 text-center text-sm text-slate-400">Cart is empty. Search for an item to add.</p>
                </template>
                <template x-if="cart.length > 0">
                  <div class="divide-y divide-[#e6eef7]">
                    <template x-for="(line, idx) in cart" :key="idx">
                      <div class="flex items-center gap-3 px-5 py-3">
                        <div class="flex-1 min-w-0">
                          <p class="font-semibold text-sm text-slate-800 truncate" x-text="line.item_name"></p>
                          <p class="text-xs text-slate-400">₱<span x-text="parseFloat(line.price).toFixed(2)"></span> / <span x-text="line.unit"></span></p>
                        </div>
                        <input x-model="line.quantity" @input="updateLineSubtotal(line)" type="number" step="0.01" min="0.01" :max="line.stock" class="w-20 rounded-xl border border-slate-200 px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
                        <p class="w-24 text-right text-sm font-semibold text-slate-800">₱<span x-text="parseFloat(line.subtotal).toFixed(2)"></span></p>
                        <button type="button" @click="removeFromCart(idx)" class="text-slate-400 hover:text-red-500 ml-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>

            <!-- Right: Payment -->
            <div class="rounded-2xl border border-[#e6eef7] bg-white p-5 shadow-sm h-fit space-y-4">
              <h3 class="font-bold text-slate-800">Payment</h3>

              <div class="space-y-1 text-sm">
                <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span class="font-semibold">₱<span x-text="totalAmount.toFixed(2)"></span></span></div>
                <div class="flex justify-between text-lg font-extrabold text-[#1f3850] pt-2 border-t border-[#e6eef7]"><span>Total</span><span>₱<span x-text="totalAmount.toFixed(2)"></span></span></div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Amount Tendered</label>
                <input x-model="amountTendered" type="number" step="0.01" min="0" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
              </div>

              <div class="flex justify-between text-sm font-semibold" x-show="parseFloat(amountTendered) >= totalAmount && cart.length > 0">
                <span class="text-slate-500">Change</span>
                <span class="text-emerald-600">₱<span x-text="changeAmount.toFixed(2)"></span></span>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Notes</label>
                <input x-model="notes" type="text" placeholder="Optional" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
              </div>

              <div x-show="error" class="rounded-xl bg-red-50 p-3 text-xs text-red-700" x-text="error"></div>

              <button type="button" @click="processSale()" :disabled="submitting || !canProcess" class="w-full rounded-xl bg-violet-600 px-4 py-3 text-sm font-bold text-white hover:bg-violet-700 disabled:opacity-40 transition">
                <span x-text="submitting ? 'Processing…' : 'Process Sale'"></span>
              </button>
            </div>
          </div>

          <!-- Receipt Modal -->
          <div x-show="receiptOpen" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4">
            <div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl overflow-hidden">
              <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-800">Receipt</h3>
                <span class="text-xs font-semibold text-slate-400" x-text="receipt ? '#' + receipt.pos_id : ''"></span>
              </div>
              <div class="px-6 py-5 space-y-3">
                <template x-if="receipt">
                  <div>
                    <ul class="divide-y divide-slate-100 text-sm mb-4">
                      <template x-for="line in receipt.items" :key="line.id">
                        <li class="flex justify-between py-2">
                          <span><span class="font-semibold" x-text="line.item_name"></span> &times; <span x-text="line.quantity"></span></span>
                          <span class="font-semibold">₱<span x-text="parseFloat(line.subtotal).toFixed(2)"></span></span>
                        </li>
                      </template>
                    </ul>
                    <div class="space-y-1 text-sm border-t border-slate-100 pt-3">
                      <div class="flex justify-between font-bold text-base text-[#1f3850]"><span>Total</span><span>₱<span x-text="parseFloat(receipt.total_amount).toFixed(2)"></span></span></div>
                      <div class="flex justify-between text-slate-600"><span>Tendered</span><span>₱<span x-text="parseFloat(receipt.amount_tendered).toFixed(2)"></span></span></div>
                      <div class="flex justify-between text-emerald-600 font-semibold"><span>Change</span><span>₱<span x-text="parseFloat(receipt.change_amount).toFixed(2)"></span></span></div>
                    </div>
                  </div>
                </template>
              </div>
              <div class="px-6 py-4 border-t border-slate-100">
                <button type="button" @click="receiptOpen = false" class="w-full rounded-xl bg-[#315b7e] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#284a67]">Done</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../../../scripts/api.js"></script>
    <script src="../../../scripts/services/inventory-service.js"></script>
    <script src="../../../scripts/components/admin-sidebar.js"></script>
    <script src="../../../scripts/components/admin-pos.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </body>
</html>
