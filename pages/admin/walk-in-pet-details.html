<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk-in Booking - Pet Information</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="min-h-screen bg-[#f6fafd] text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 lg:px-8">
      <section class="mb-6">
        <a
          href="./walk-in-booking.html"
          class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          &larr; Back to Owner Information
        </a>

        <div class="mt-4">
          <h1 class="text-3xl font-bold text-[#2f4b66]">
            Walk-in Booking
          </h1>
        </div>

        <div class="mt-6">
          <div
            class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500"
          >
            <span>Step 2 of 5</span>
            <span>40% Complete</span>
          </div>
          <div class="h-2 w-full rounded-full bg-slate-200">
            <div
              class="h-2 rounded-full bg-[#315b7e]"
              style="width: 40%"
            ></div>
          </div>
        </div>
      </section>

      <section class="rounded-3xl bg-[#cfe3f6] p-6 shadow-lg md:p-8">
        <div class="mx-auto max-w-5xl">
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-[#2f4b66]">Pet Information</h2>
            <p class="mt-1 text-xs text-slate-500">
              Maximum of 2 pets per walk-in booking.
            </p>
          </div>

          <div class="mb-6 flex flex-col gap-3 sm:flex-row">
            <button
              id="showAddPetBtn"
              type="button"
              class="rounded-2xl bg-[#315b7e] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#274864]"
            >
              Add Pet
            </button>
          </div>

          <div
            id="petStepMessage"
            class="mb-6 rounded-2xl border border-dashed border-[#9ebedf] bg-white/80 p-5 text-sm text-slate-500"
          >
            Add pet details for this walk-in booking.
          </div>

          <section
            id="addPetSection"
            class="rounded-2xl bg-white/85 p-5 shadow-sm"
          >
            <div class="mb-4">
              <h3 class="text-lg font-bold text-[#2f4b66]">Add Pet</h3>
            </div>

            <!--
              BACKEND TEAMMATE + CLAUDE CODE:
              Added pets live only in the frontend walk-in draft right now.
              Persist these fields as draft pet records before final booking
              submission once the database flow is connected.
            -->
            <form id="addPetForm" class="space-y-5" novalidate>
              <div class="grid gap-5 md:grid-cols-2">
                <div>
                  <label
                    for="petType"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Pet Type <span class="text-red-500">*</span>
                  </label>
                  <div class="relative">
                    <select
                      id="petType"
                      name="petType"
                      class="booking-select w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                      required
                    >
                      <option value="">Select pet type</option>
                      <option value="Dog">Dog</option>
                      <option value="Cat">Cat</option>
                    </select>
                    <i
                      data-lucide="chevron-down"
                      class="booking-select-icon h-5 w-5 text-slate-500"
                      aria-hidden="true"
                    ></i>
                  </div>
                </div>

                <div>
                  <label
                    for="petName"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Pet Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="petName"
                    name="petName"
                    type="text"
                    maxlength="100"
                    placeholder="Enter pet name"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    required
                  />
                </div>

                <div>
                  <label
                    for="breed"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Breed
                  </label>
                  <input
                    id="breed"
                    name="breed"
                    type="text"
                    maxlength="100"
                    placeholder="Enter breed"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  />
                </div>

                <div>
                  <label
                    for="weight"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Weight
                  </label>
                  <input
                    id="weight"
                    name="weight"
                    type="text"
                    placeholder="e.g. 12 kg"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  />
                </div>

                <div>
                  <label
                    for="furType"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Fur Type
                  </label>
                  <div class="relative">
                    <select
                      id="furType"
                      name="furType"
                      class="booking-select w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    >
                      <option value="">Select fur type</option>
                    </select>
                    <i
                      data-lucide="chevron-down"
                      class="booking-select-icon h-5 w-5 text-slate-500"
                      aria-hidden="true"
                    ></i>
                  </div>
                </div>

                <div class="md:col-span-2">
                  <label
                    for="size"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Size
                  </label>
                  <div class="relative">
                    <select
                      id="size"
                      name="size"
                      class="booking-select w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    >
                      <option value="">Select size</option>
                    </select>
                    <i
                      data-lucide="chevron-down"
                      class="booking-select-icon h-5 w-5 text-slate-500"
                      aria-hidden="true"
                    ></i>
                  </div>
                </div>

                <div class="md:col-span-2">
                  <label
                    for="medicalNotes"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Medical Conditions / Special Needs
                  </label>
                  <textarea
                    id="medicalNotes"
                    name="medicalNotes"
                    rows="4"
                    placeholder="Describe allergies, medical conditions, or special care instructions..."
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  ></textarea>
                </div>
              </div>

              <div class="flex justify-end">
                <button
                  id="savePetBtn"
                  type="submit"
                  class="rounded-2xl bg-[#315b7e] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#274864]"
                >
                  Add Pet
                </button>
              </div>
            </form>
          </section>

          <section class="mt-8 rounded-2xl bg-white/90 p-5 shadow-sm">
            <div class="mb-4 flex items-center justify-between gap-3">
              <div>
                <h3 class="text-lg font-bold text-[#2f4b66]">Selected Pets</h3>
              </div>
              <div
                id="selectedPetCount"
                class="rounded-full bg-[#edf5fc] px-3 py-1 text-xs font-semibold text-[#315b7e]"
              >
                0 / 2 selected
              </div>
            </div>

            <div
              id="selectedPetsEmptyState"
              class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-6 text-center text-sm text-slate-500"
            >
              <p class="font-semibold text-slate-600">No pets added yet</p>
              <p class="mt-1">Add a pet to continue.</p>
            </div>

            <div id="selectedPetCards" class="grid gap-4 md:grid-cols-2"></div>
          </section>

          <div class="mt-8 flex items-center justify-between gap-4">
            <button
              id="backBtn"
              type="button"
              class="rounded-2xl border border-[#315b7e] px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]"
            >
              Back
            </button>

            <button
              id="nextBtn"
              type="button"
              disabled
              class="cursor-not-allowed rounded-2xl bg-[#315b7e] px-6 py-3 text-sm font-semibold text-white opacity-50 transition"
            >
              Next Step
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      lucide.createIcons();
    </script>

    <script src="../../scripts/api.js"></script>
    <script
      type="module"
      src="../../scripts/components/walk-in-pet-step.js"
    ></script>
  </body>
</html>
