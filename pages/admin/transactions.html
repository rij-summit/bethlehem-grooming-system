<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?v=staff-sidebar-20260719" />
  </head>
  <body class="bg-[#f5f8fb] text-slate-800">
    <div
      x-data="adminSidebar()"
      x-cloak
      class="min-h-screen flex bg-[#f5f8fb]"
    >
      <!-- Mobile Backdrop -->
      <div
        x-cloak
        x-show="sidebarOpen"
        x-transition.opacity
        class="fixed inset-0 z-40 bg-slate-900/40 lg:hidden"
        @click="sidebarOpen = false"
      ></div>

      <!-- Sidebar -->
      <!-- NOTE: Keep using your already existing sidebar structure/script -->
      <aside
        class="admin-sidebar-menu fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-[#d7e3ef] bg-[#a9bfd6] shadow-xl transition-transform duration-300 lg:translate-x-0"
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
      >
        <!-- Brand -->
        <div class="px-6 py-6">
          <div class="flex items-start gap-4">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white p-1.5 shadow-sm">
              <img
                src="../../assets/images/clinic/Bethlehem_Logo-256.png"
                alt="Bethlehem Animal Clinic logo"
                class="h-full w-full object-contain"
              />
            </div>
            <div class="min-w-0">
              <h1 class="text-xl font-extrabold leading-tight text-[#1f3850]">Bethlehem Animal</h1>
              <p class="text-sm font-medium text-[#355674]">Clinic &amp; Grooming</p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="px-4 py-6">
          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Main</p>
            <div class="space-y-1.5">
              <a href="./dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'dashboard' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
                <span>Dashboard</span>
              </a>
              <a href="./clients.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'customers' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span>Customers</span>
              </a>
              <a href="./appointments.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'appointments' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="calendar-days" class="h-5 w-5"></i>
                <span>Schedules</span>
                <span x-show="hasIncomingAppointments" style="display: none" class="ml-auto h-2.5 w-2.5 rounded-full bg-red-500" aria-label="Incoming schedules"></span>
              </a>
              <a href="./clinic.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'clinic' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="stethoscope" class="h-5 w-5"></i>
                <span>Clinic</span>
              </a>
              <a href="./inventory.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'inventory' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="box" class="h-5 w-5"></i>
                <span>Inventory</span>
              </a>
            </div>
          </div>

          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Records</p>
            <div class="space-y-1.5">
              <a href="./archive.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'archive' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="archive" class="h-5 w-5"></i>
                <span>Archive</span>
              </a>
              <a href="./transactions.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'transactions' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="receipt" class="h-5 w-5"></i>
                <span>Transactions</span>
              </a>
              <a href="./reports.html" x-show="isAdmin" style="display: none" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'reports' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="clipboard-list" class="h-5 w-5"></i>
                <span>Reports</span>
              </a>
            </div>
          </div>

          <div x-show="isAdmin">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">System</p>
            <div class="space-y-1.5">
              <a href="./settings.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'settings' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="settings" class="h-5 w-5"></i>
                <span>Settings</span>
              </a>
            </div>
          </div>
        </nav>

        <!-- Admin Info -->
        <div class="admin-sidebar-footer p-4">
          <div class="mb-4 flex items-center gap-3 rounded-2xl bg-[#355c84] p-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-sm font-extrabold text-white" x-text="isAdmin ? 'AD' : 'ST'">AD</div>
            <div class="min-w-0">
              <!-- BACKEND: Replace with logged-in admin data -->
              <p class="truncate font-bold text-white" x-text="isAdmin ? 'Admin' : 'Staff'">Admin</p>
              <p class="truncate text-sm text-white/80" x-text="isAdmin ? 'Clinic Manager' : 'Receptionist'">Clinic Manager</p>
            </div>
          </div>
          <!-- Stop Receiving / Reopen toggle — hidden from staff (admin only) -->
          <button
            type="button"
            x-show="isAdmin"
            @click="handleStopReceivingClick()"
            class="mb-2 flex w-full items-center justify-center gap-2 rounded-2xl px-4 py-3 font-bold transition"
            :class="clinicStopped ? 'btn-clinic-reopen' : 'btn-clinic-stop'"
          >
            <i data-lucide="door-closed" class="h-4 w-4 shrink-0"></i>
            <span x-text="clinicStopped ? 'Reopen Today' : 'We\'re Done for Today'"></span>
          </button>
          <button type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-[#6e8ba8] px-4 py-3 font-bold text-[#1f3850] transition hover:bg-white/30" @click="handleLogout()">
            <i data-lucide="log-out" class="h-4 w-4"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- Stop Receiving Confirmation Modal -->
      <div x-cloak x-show="stopModal.open" x-transition class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 px-4">
        <div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl overflow-hidden">
          <div class="px-6 py-5">
            <h4 class="text-lg font-bold text-slate-800" x-text="stopModal.title"></h4>
            <p class="mt-2 text-sm text-slate-600" x-text="stopModal.message"></p>
            <p x-show="stopModal.error" class="mt-2 text-sm text-red-600" x-text="stopModal.error"></p>
          </div>
          <div class="flex gap-3 px-6 py-4">
            <button type="button" @click="stopModal.open = false" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
            <button type="button" @click="executeStopReceiving()" :disabled="stopModal.busy" class="flex-1 rounded-xl px-4 py-2 text-sm font-semibold transition" :class="clinicStopped ? 'btn-confirm-reopen' : 'btn-confirm-stop'">
              <span x-text="stopModal.busy ? 'Please wait...' : stopModal.confirmLabel"></span>
            </button>
          </div>
        </div>
      </div>
      <!-- Main Content -->
      <div class="flex min-h-screen flex-1 flex-col lg:ml-[280px]">

        <!-- Mobile Header -->
        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-[#d7e3ef] bg-[#f5f8fb]/90 px-4 py-4 backdrop-blur lg:hidden">
          <div>
            <p class="text-sm font-semibold text-[#5c7690]">Admin Panel</p>
            <h2 class="text-lg font-extrabold text-[#1f3850]">Transactions</h2>
          </div>
          <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-[#c9d9e8] bg-white text-[#315b7e] shadow-sm" @click="sidebarOpen = true">
            <i data-lucide="menu" class="h-5 w-5"></i>
          </button>
        </header>

        <!-- Transactions Content -->
        <main
          x-data="adminTransactions()"
          class="flex-1 px-4 py-6 lg:px-6 lg:pt-0"
        >
          <!-- Top Banner -->
          <section class="lg:sticky lg:top-0 lg:z-30 lg:-mx-6 lg:bg-[#f5f8fb]/95 lg:px-6 lg:py-4 lg:backdrop-blur">
            <div class="rounded-[24px] border border-[#cfe0ee] bg-[#a9bfd6] px-4 py-4 lg:px-6 lg:py-4">
              <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
                <div>
                  <h2 class="text-2xl font-extrabold text-[#1f3850] lg:text-3xl">Transactions</h2>
                  <p class="mt-1 text-xs font-medium tracking-[0.18em] text-[#355674] lg:text-sm lg:tracking-[0.25em]">PAYMENT HISTORY</p>
                </div>

                <!-- Collection summary card -->
                <div class="rounded-xl border border-[#86efac] bg-white/75 px-4 py-2.5 shadow-sm sm:min-w-[220px]">
                  <p class="text-xs font-semibold uppercase tracking-widest text-[#16a34a]" x-text="collectionTitle"></p>
                  <p class="mt-0.5 text-2xl font-bold leading-tight text-[#15803d]" x-text="formatPeso(collectionTotal)"></p>
                  <p class="text-xs text-slate-500" x-text="collectionCount + ' transaction' + (collectionCount !== 1 ? 's' : '')"></p>
                </div>
              </div>

              <!-- Filters -->
              <div class="mt-4 flex flex-wrap items-center gap-3">
                <!-- Search -->
                <label class="relative block min-w-0 flex-1 sm:min-w-[280px]">
                  <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                    <i data-lucide="search" class="h-4 w-4"></i>
                  </span>
                  <input
                    type="text"
                    x-model="searchQuery"
                    @input.debounce.400ms="onSearchChange()"
                    placeholder="Search by owner or pet..."
                    class="w-full rounded-xl border border-transparent bg-white px-10 py-3 text-sm outline-none placeholder:text-slate-400 focus:border-[#7fa2c9]"
                  />
                </label>

                <!-- Period filter -->
                <div class="flex items-center gap-2 rounded-xl bg-white border border-[#c9d9e8] px-3 py-2.5">
                  <i data-lucide="calendar-range" class="h-4 w-4 text-[#315b7e] shrink-0"></i>
                  <select
                    x-model="transactionPeriod"
                    @change="onPeriodChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  >
                    <option value="day">Day</option>
                    <option value="month">Month</option>
                    <option value="year">Year</option>
                  </select>
                </div>

                <!-- Period value filter -->
                <div class="flex items-center gap-2 rounded-xl bg-white border border-[#c9d9e8] px-3 py-2.5">
                  <i data-lucide="calendar" class="h-4 w-4 text-[#315b7e] shrink-0"></i>
                  <input
                    x-show="transactionPeriod === 'day'"
                    type="date"
                    x-model="filterDate"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                  <input
                    x-show="transactionPeriod === 'month'"
                    type="month"
                    x-model="filterMonth"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                  <input
                    x-show="transactionPeriod === 'year'"
                    type="number"
                    min="2000"
                    max="2100"
                    step="1"
                    x-model="filterYear"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                </div>

                <!-- Clear filters -->
                <template x-if="hasActiveFilters">
                  <button
                    type="button"
                    @click="clearFilters()"
                    class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50"
                  >
                    <i data-lucide="x" class="h-4 w-4"></i>
                    Clear Filters
                  </button>
                </template>

                <!-- Total count -->
                <span class="ml-auto rounded-xl bg-white border border-[#c9d9e8] px-4 py-2.5 text-sm font-semibold text-slate-600">
                  <span x-text="totalCount"></span> total
                </span>
              </div>
            </div>
          </section>

          <!-- Loading -->
          <template x-if="loading">
            <div class="mt-6 py-16 text-center text-slate-400">
              <i data-lucide="loader-2" class="mx-auto h-8 w-8 animate-spin"></i>
              <p class="mt-3 text-sm">Loading transactions...</p>
            </div>
          </template>

          <!-- Error -->
          <template x-if="!loading && errorMessage">
            <div class="mt-6 rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-sm text-red-700">
              <span x-text="errorMessage"></span>
            </div>
          </template>

          <!-- Empty state -->
          <template x-if="!loading && !errorMessage && transactions.length === 0">
            <div class="mt-6 rounded-[24px] border border-dashed border-[#bfd3e3] bg-white p-10 text-center">
              <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-[#dcfce7] text-[#16a34a]">
                <i data-lucide="receipt" class="h-8 w-8"></i>
              </div>
              <p class="mt-4 text-lg font-bold text-[#2f4b66]">No transactions yet</p>
              <p class="mt-2 text-sm text-slate-500">Payment records will appear here once payments are processed.</p>
            </div>
          </template>

          <!-- Transaction groups -->
          <template x-if="!loading && !errorMessage && transactions.length > 0">
            <div class="mt-6 space-y-8">
              <template x-for="group in groupedTransactions" :key="group.dateKey">
                <div>
                  <!-- Date group header -->
                  <div class="mb-3 flex items-center gap-3">
                    <span
                      class="whitespace-nowrap text-sm font-bold uppercase tracking-wide"
                      :class="group.isToday ? 'text-[#16a34a]' : 'text-slate-400'"
                      x-text="group.isToday ? 'Today — ' + group.label : group.label"
                    ></span>
                    <div class="h-px flex-1" :class="group.isToday ? 'bg-[#86efac]' : 'bg-slate-200'"></div>
                    <!-- Daily total -->
                    <span
                      class="shrink-0 rounded-full px-3 py-1 text-xs font-bold"
                      :class="group.isToday ? 'bg-[#dcfce7] text-[#15803d]' : 'bg-slate-100 text-slate-500'"
                      x-text="formatPeso(group.total)"
                    ></span>
                  </div>

                  <!-- Transaction rows -->
                  <div class="rounded-2xl border border-[#d7e3ef] bg-white overflow-hidden shadow-sm">
                    <template x-for="(tx, index) in group.items" :key="tx.id">
                      <div
                        class="flex flex-col gap-3 px-5 py-4 sm:flex-row sm:items-center sm:justify-between"
                        :class="index > 0 ? 'border-t border-slate-100' : ''"
                      >
                        <!-- Left: info -->
                        <div class="flex flex-col gap-0.5 min-w-0">
                          <div class="flex flex-wrap items-center gap-2">
                            <p class="font-semibold text-slate-800" x-text="tx.ownerName"></p>
                            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-500" x-text="tx.reference"></span>
                          </div>
                          <p class="text-sm text-slate-500">
                            <span x-text="tx.petName"></span>
                            &nbsp;&middot;&nbsp;
                            <span x-text="tx.serviceLabel"></span>
                          </p>
                          <p class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
                            <i data-lucide="clock" class="h-3 w-3"></i>
                            <span x-text="formatTime(tx.paidAt)"></span>
                            <template x-if="tx.notes">
                              <span class="ml-2 text-slate-300">&middot;</span>
                            </template>
                            <template x-if="tx.notes">
                              <span x-text="tx.notes"></span>
                            </template>
                            <template x-if="tx.paymentMethod">
                              <span class="ml-2 rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold uppercase text-slate-500" x-text="tx.paymentMethod"></span>
                            </template>
                          </p>
                          <div x-show="tx.paymentSummary?.pets?.length" class="mt-2 flex flex-wrap gap-2">
                            <template x-for="pet in tx.paymentSummary?.pets || []" :key="pet.booking_pet_id">
                              <span class="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-600">
                                <strong x-text="pet.pet_name"></strong>
                                <span x-text="' · ' + formatPeso(pet.final_pet_charge)"></span>
                                <span x-show="pet.payment_kind === 'stopped_reviewed'" class="font-semibold text-amber-700" x-text="' · ' + (pet.review_decision_label || 'Reviewed stop')"></span>
                              </span>
                            </template>
                          </div>
                        </div>

                        <!-- Right: amounts -->
                        <div class="flex shrink-0 items-center gap-6 text-right">
                          <div>
                            <p class="text-xs text-slate-400">Paid</p>
                            <p class="font-bold text-slate-700" x-text="formatPeso(tx.amountPaid)"></p>
                          </div>
                          <div>
                            <p class="text-xs text-slate-400">Change</p>
                            <p class="font-bold text-slate-500" x-text="formatPeso(tx.changeGiven)"></p>
                          </div>
                          <div>
                            <p class="text-xs text-slate-400">Total</p>
                            <p class="text-lg font-bold text-[#16a34a]" x-text="formatPeso(tx.finalPrice)"></p>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

        </main>
      </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../scripts/api.js?v=email-verification-20260726"></script>
    <script src="../../scripts/components/admin-sidebar.js?v=logout-fix-20260726"></script>
    <script src="../../scripts/components/admin-transactions.js"></script>
  </body>
</html>
