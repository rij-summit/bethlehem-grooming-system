<div class="min-w-0 px-4 py-6 lg:px-6 lg:pt-3">
  <header class="rounded-[28px] border border-[#cfe0ee] bg-[#a9bfd6] px-4 py-5 lg:px-6 lg:py-6">
    <h2 class="text-3xl font-extrabold text-[#1f3850] lg:text-4xl">Clinic Services</h2>
    <p class="mt-2 text-sm text-[#355674]">Manage services and pricing that can be added to clinic cases.</p>
  </header>

  <div class="mt-5 flex flex-wrap items-end gap-3" role="search" aria-label="Filter clinic services">
    <label class="w-full min-w-0 sm:w-auto sm:flex-1 sm:min-w-[240px]">
      <span class="sr-only">Search services</span>
      <input type="search" x-model="q" @input="search()" maxlength="200" placeholder="Search services..." class="w-full rounded-xl border border-[#cfe0ee] bg-white px-4 py-3 text-sm outline-none focus:border-[#315b7e]" />
    </label>
    <label class="w-full sm:w-auto sm:flex-none"><span class="sr-only">Category</span>
      <select x-model="category" @change="load()" class="w-full rounded-xl border border-[#cfe0ee] bg-white px-3 py-3 text-sm outline-none focus:border-[#315b7e]">
        <option value="">All categories</option>
        <template x-for="item in categories" :key="item.id"><option :value="item.id" x-text="item.name"></option></template>
      </select>
    </label>
    <label class="min-w-[120px] flex-1 sm:flex-none"><span class="sr-only">Type</span>
      <select x-model="type" @change="load()" class="w-full rounded-xl border border-[#cfe0ee] bg-white px-3 py-3 text-sm outline-none focus:border-[#315b7e]">
        <option value="">All types</option><option value="__none__">Not Applicable</option>
        <template x-for="item in types" :key="item"><option :value="item" x-text="item"></option></template>
      </select>
    </label>
    <label class="min-w-[120px] flex-1 sm:flex-none"><span class="sr-only">Status</span>
      <select x-model="status" @change="load()" class="w-full rounded-xl border border-[#cfe0ee] bg-white px-3 py-3 text-sm outline-none focus:border-[#315b7e]">
        <option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All statuses</option>
      </select>
    </label>
    <button type="button" @click="openModal()" :disabled="!optionsLoaded" class="inline-flex w-full shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-xl bg-[#315b7e] px-4 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-[#274b69] disabled:opacity-50 sm:ml-auto sm:w-auto"><i data-lucide="plus" class="h-4 w-4"></i>Add Service</button>
  </div>
  <div class="my-3 flex items-center gap-3 text-sm text-slate-500" aria-live="polite">
    <span x-show="!loading && !error" x-text="total + ' service' + (total === 1 ? '' : 's')"></span>
    <button type="button" x-show="filtersActive" @click="clearFilters()" class="font-semibold text-[#315b7e] underline underline-offset-2">Clear filters</button>
  </div>
  <div x-show="error" role="alert" class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"><span x-text="error"></span><button type="button" @click="load(currentPage)" class="ml-3 font-semibold underline">Try again</button></div>

  <div class="overflow-hidden rounded-2xl border border-[#cfe0ee] bg-white shadow-sm" :aria-busy="loading">
    <div class="overflow-x-auto" tabindex="0" role="region" aria-label="Clinic Services table">
      <table class="w-full min-w-[800px] text-left text-sm">
        <caption class="sr-only">Clinic Services catalog, pricing and status</caption>
        <thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr>
          <th scope="col" class="px-4 py-3">Service</th><th scope="col" class="px-4 py-3">Category</th><th scope="col" class="px-4 py-3">Type</th><th scope="col" class="px-4 py-3">Pricing</th><th scope="col" class="px-4 py-3">Status</th><th scope="col" class="w-px whitespace-nowrap px-4 py-3 text-right">Actions</th>
        </tr></thead>
        <tbody class="divide-y divide-slate-100">
          <template x-for="service in (!loading && !error ? rows : [])" :key="service.id">
            <tr tabindex="0" @click="openDetails(service, $event)" @keydown.enter.self.prevent="openDetails(service, $event)" @keydown.space.self.prevent="openDetails(service, $event)" :aria-label="'View details for ' + service.name + (service.type ? ' · ' + service.type : '')" aria-haspopup="dialog" class="cursor-pointer hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#315b7e] focus-visible:-outline-offset-2">
              <th scope="row" class="max-w-[260px] break-words px-4 py-4 font-semibold text-[#2f4b66]" x-text="service.name"></th>
              <td class="px-4 py-4 text-slate-600" x-text="service.category.name"></td>
              <td class="px-4 py-4 text-slate-600" x-text="service.type || '—'"></td>
              <td class="whitespace-nowrap px-4 py-4 font-medium text-slate-700" x-text="pricing(service)"></td>
              <td class="px-4 py-4"><span class="rounded-full px-2.5 py-1 text-xs font-semibold" :class="service.is_active ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'" x-text="service.is_active ? 'Active' : 'Inactive'"></span></td>
              <td class="w-px whitespace-nowrap px-4 py-3"><div class="flex items-center justify-end gap-2">
                <button type="button" @click.stop="openModal(service)" :disabled="busyId !== null" :aria-label="'Edit ' + service.name + (service.type ? ' · ' + service.type : '')" class="rounded-lg border border-[#d0e4f2] bg-[#eef5fb] px-3 py-2 text-xs font-semibold text-[#315b7e] hover:bg-slate-100 disabled:opacity-50">Edit</button>
                <button type="button" @click.stop="changeStatus(service)" :disabled="busyId !== null" :title="service.is_active ? 'Deactivate service' : 'Reactivate service'" :aria-label="(busyId === service.id ? 'Updating ' : service.is_active ? 'Deactivate ' : 'Reactivate ') + service.name + (service.type ? ' · ' + service.type : '')" :aria-busy="busyId === service.id" class="inline-flex h-9 w-9 items-center justify-center rounded-lg hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#315b7e] disabled:opacity-50" :class="service.is_active ? 'text-red-600' : 'text-[#315b7e]'">
                  <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false" class="h-5 w-5" :class="{'animate-spin': busyId === service.id}"><use :href="'../../assets/icons/phosphor.svg#' + (busyId === service.id ? 'spinner-gap' : service.is_active ? 'x-circle' : 'arrow-counter-clockwise')"></use></svg>
                </button>
              </div></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div x-show="loading" class="px-4 py-10 text-center text-sm text-slate-500" role="status">Loading services…</div>
    <div x-show="!loading && !error && total === 0" class="px-4 py-12 text-center">
      <p class="font-semibold text-[#2f4b66]" x-text="filtersActive ? 'No matching services' : 'No active services yet'"></p>
      <p class="mt-2 text-sm text-slate-500" x-text="filtersActive ? 'Try a different search or clear the filters.' : 'Add a service to begin, or choose All statuses to view inactive services.'"></p>
    </div>
    <nav x-show="!error && lastPage > 1" aria-label="Services pagination" class="flex items-center justify-between gap-3 border-t border-slate-100 px-4 py-3 text-sm">
      <span class="text-slate-500" x-text="'Page ' + currentPage + ' of ' + lastPage"></span>
      <div class="flex gap-2"><button type="button" @click="load(currentPage - 1)" :disabled="loading || currentPage <= 1" class="rounded-xl border border-slate-200 px-3 py-2 font-semibold text-[#315b7e] hover:bg-slate-50 disabled:opacity-40">Previous</button><button type="button" @click="load(currentPage + 1)" :disabled="loading || currentPage >= lastPage" class="rounded-xl border border-slate-200 px-3 py-2 font-semibold text-[#315b7e] hover:bg-slate-50 disabled:opacity-40">Next</button></div>
    </nav>
  </div>
</div>

<dialog x-ref="serviceDialog" @cancel.prevent @pointerdown.self.prevent aria-labelledby="clinic-service-title" class="m-auto w-[calc(100%_-_2rem)] max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-slate-900/60">
  <form x-ref="serviceForm" novalidate @submit.prevent="save()">
    <header class="flex items-center justify-between gap-3 border-b border-slate-200 px-6 py-5">
      <h3 id="clinic-service-title" class="text-lg font-bold text-[#2f4b66]" x-text="editingId ? 'Edit Service' : 'Add Service'"></h3>
      <button type="button" @click="closeModal()" :disabled="saving" aria-label="Close service dialog" class="rounded-xl p-2 text-slate-500 hover:bg-slate-100 disabled:opacity-50"><i data-lucide="x" class="h-5 w-5"></i></button>
    </header>
    <div class="space-y-4 px-6 py-5">
      <p x-show="formError" x-ref="formError" tabindex="-1" role="alert" x-text="formError" class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700"></p>
      <fieldset :disabled="saving" class="grid min-w-0 grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="sm:col-span-2"><span class="mb-1 block text-sm font-medium text-slate-600">Service Name <span aria-hidden="true" class="text-red-600">*</span></span><input x-ref="serviceName" x-model="form.name" required maxlength="200" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]" /></label>
        <label><span class="mb-1 block text-sm font-medium text-slate-600">Category <span aria-hidden="true" class="text-red-600">*</span></span><select x-model="form.category_id" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]"><option value="">Select category</option><template x-for="item in categories" :key="item.id"><option :value="item.id" x-text="item.name"></option></template></select></label>
        <label><span class="mb-1 block text-sm font-medium text-slate-600">Type</span><select x-model="form.type" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]"><option value="">Not Applicable</option><template x-for="item in types" :key="item"><option :value="item" x-text="item"></option></template></select><span class="mt-1 block text-xs text-slate-500">Choose Not Applicable when a type does not apply.</span></label>
        <label><span class="mb-1 block text-sm font-medium text-slate-600">Pricing Method</span><select x-model="form.pricing_method" @change="formError = ''; priceErrors = {}" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]"><option value="fixed">Fixed</option><option value="range">Range</option><option value="starting_at">Starting At</option><option value="tiered">Tiered</option></select></label>
        <label><span class="mb-1 block text-sm font-medium text-slate-600">Billing Unit</span><select x-model="form.billing_unit" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]"><option value="">None</option><option value="service">Per service</option><option value="visit">Per visit</option><option value="day">Per day</option><option value="sample">Per sample</option><option value="pet">Per pet</option></select></label>
        <template x-if="form.pricing_method === 'fixed' || form.pricing_method === 'starting_at'"><label class="sm:col-span-2"><span class="mb-1 block text-sm font-medium text-slate-600" x-text="form.pricing_method === 'fixed' ? 'Price (₱)' : 'Starting Price (₱)'"></span><input data-money-input inputmode="decimal" type="number" x-model="form.price" required min="0" :max="maximumPrice" step="0.01" class="w-full rounded-xl border bg-white px-3 py-2 text-sm outline-none" @blur="validatePrice('price')" @input="priceInput('price')" :aria-invalid="Boolean(priceErrors.price)" aria-describedby="service-price-error" :class="priceErrors.price ? 'border-red-500 focus:border-red-500' : 'border-slate-300 focus:border-[#315b7e]'" /><span id="service-price-error" x-show="priceErrors.price" x-text="priceErrors.price" class="mt-1 block text-xs text-red-600" aria-live="polite"></span></label></template>
        <template x-if="form.pricing_method === 'range'"><div class="grid min-w-0 grid-cols-1 gap-4 sm:col-span-2 sm:grid-cols-2">
          <label><span class="mb-1 block text-sm font-medium text-slate-600">Minimum Price (₱)</span><input data-money-input inputmode="decimal" type="number" x-model="form.min_price" required min="0" :max="maximumPrice" step="0.01" class="w-full rounded-xl border bg-white px-3 py-2 text-sm outline-none" @blur="validatePrice('min_price')" @input="priceInput('min_price')" :aria-invalid="Boolean(priceErrors.min_price)" aria-describedby="service-min_price-error" :class="priceErrors.min_price ? 'border-red-500 focus:border-red-500' : 'border-slate-300 focus:border-[#315b7e]'" /><span id="service-min_price-error" x-show="priceErrors.min_price" x-text="priceErrors.min_price" class="mt-1 block text-xs text-red-600" aria-live="polite"></span></label>
          <label><span class="mb-1 block text-sm font-medium text-slate-600">Maximum Price (₱)</span><input data-money-input inputmode="decimal" type="number" x-model="form.max_price" required min="0" :max="maximumPrice" step="0.01" class="w-full rounded-xl border bg-white px-3 py-2 text-sm outline-none" @blur="validatePrice('max_price')" @input="priceInput('max_price')" :aria-invalid="Boolean(priceErrors.max_price)" aria-describedby="service-max_price-error" :class="priceErrors.max_price ? 'border-red-500 focus:border-red-500' : 'border-slate-300 focus:border-[#315b7e]'" /><span id="service-max_price-error" x-show="priceErrors.max_price" x-text="priceErrors.max_price" class="mt-1 block text-xs text-red-600" aria-live="polite"></span></label>
        </div></template>
        <template x-if="form.pricing_method === 'tiered'"><div class="space-y-3 sm:col-span-2">
          <label><span class="mb-1 block text-sm font-medium text-slate-600">Tier Basis</span><select x-model="form.tier_basis" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm"><option value="pet_size">Pet Size</option></select></label>
          <p class="text-xs text-slate-500">Select the sizes offered and enter a price for each.</p>
          <template x-for="tier in form.tiers" :key="tier.size"><div class="flex items-center gap-3">
            <label class="flex min-w-[120px] items-center gap-2 text-sm text-slate-600"><input type="checkbox" x-model="tier.enabled" @change="delete priceErrors[tier.size]" /><span x-text="tierLabel(tier.size)"></span></label>
            <div class="min-w-0 flex-1"><input data-money-input inputmode="decimal" type="number" x-model="tier.price" :disabled="!tier.enabled || saving" :required="tier.enabled" :aria-label="tierLabel(tier.size) + ' price (₱)'" min="0" :max="maximumPrice" step="0.01" placeholder="Price (₱)" class="w-full rounded-xl border bg-white px-3 py-2 text-sm outline-none disabled:bg-slate-50" @blur="validatePrice(tier.size)" @input="priceInput(tier.size)" :aria-invalid="Boolean(priceErrors[tier.size])" :aria-describedby="'service-tier-' + tier.size + '-error'" :class="priceErrors[tier.size] ? 'border-red-500 focus:border-red-500' : 'border-slate-300 focus:border-[#315b7e]'" /><p :id="'service-tier-' + tier.size + '-error'" x-show="priceErrors[tier.size]" x-text="priceErrors[tier.size]" class="mt-1 text-xs text-red-600" aria-live="polite"></p></div>
          </div></template>
        </div></template>
        <label class="sm:col-span-2"><span class="mb-1 block text-sm font-medium text-slate-600">Notes</span><textarea x-model="form.notes" rows="3" maxlength="5000" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#315b7e]"></textarea></label>
      </fieldset>
    </div>
    <footer class="flex justify-end gap-3 border-t border-slate-200 px-6 py-4"><button type="button" @click="closeModal()" :disabled="saving" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-50">Cancel</button><button type="submit" :disabled="saving" class="rounded-xl bg-[#315b7e] px-4 py-2 text-sm font-semibold text-white hover:bg-[#274b69] disabled:opacity-50" x-text="saving ? 'Saving…' : editingId ? 'Save Changes' : 'Add Service'"></button></footer>
  </form>
</dialog>

<dialog x-ref="detailsDialog" @cancel.prevent @pointerdown.self.prevent aria-labelledby="clinic-service-details-title" class="m-auto w-[calc(100%_-_2rem)] max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-slate-900/60">
  <header class="flex items-center justify-between gap-3 border-b border-slate-200 px-6 py-5">
    <h3 id="clinic-service-details-title" class="text-lg font-bold text-[#2f4b66]">Service Details</h3>
    <button x-ref="detailsClose" type="button" @click="closeDetails()" aria-label="Close service details" class="rounded-xl p-2 text-slate-500 hover:bg-slate-100"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false" class="h-5 w-5"><use href="../../assets/icons/phosphor.svg#x"></use></svg></button>
  </header>
  <template x-if="details">
    <div class="space-y-6 px-6 py-5">
      <section aria-labelledby="clinic-service-information-heading">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <h4 id="clinic-service-information-heading" class="min-w-0 break-words text-lg font-bold text-[#2f4b66]" x-text="details.name"></h4>
          <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-semibold" :class="details.is_active ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'" x-text="details.is_active ? 'Active' : 'Inactive'"></span>
        </div>
        <dl class="mt-4 grid grid-cols-1 gap-4 text-sm sm:grid-cols-2">
          <div><dt class="text-xs text-slate-500">Category</dt><dd class="mt-1 break-words text-slate-800" x-text="details.category.name"></dd></div>
          <div><dt class="text-xs text-slate-500">Type</dt><dd class="mt-1 text-slate-800" x-text="details.type || 'Not Applicable'"></dd></div>
        </dl>
      </section>
      <section aria-labelledby="clinic-service-pricing-heading">
        <h4 id="clinic-service-pricing-heading" class="mb-3 text-sm font-bold text-[#355674]">Service Pricing</h4>
        <dl class="grid grid-cols-1 gap-4 rounded-2xl border border-[#e6eef7] bg-[#f5f8fb] p-4 text-sm sm:grid-cols-2">
          <div class="sm:col-span-2"><dt class="text-xs text-slate-500">Price</dt><dd class="mt-1 break-words text-lg font-bold text-[#315b7e]" x-text="pricing(details)"></dd></div>
          <div><dt class="text-xs text-slate-500">Pricing Method</dt><dd class="mt-1 text-slate-800" x-text="({fixed: 'Fixed', range: 'Range', starting_at: 'Starting At', tiered: 'Tiered by Pet Size'})[details.pricing_method]"></dd></div>
          <div><dt class="text-xs text-slate-500">Billing Unit</dt><dd class="mt-1 text-slate-800" x-text="'Per ' + (details.billing_unit || 'service')"></dd></div>
        </dl>
        <div x-show="details.pricing_method === 'tiered'" class="mt-4">
          <h5 class="mb-2 text-xs font-semibold text-slate-500">Pet Size Prices</h5>
          <dl class="divide-y divide-slate-100 text-sm">
            <template x-for="tier in (details.tiers || [])" :key="tier.size"><div class="flex items-center justify-between gap-3 py-2"><dt class="text-slate-600" x-text="tierLabel(tier.size)"></dt><dd class="font-semibold text-slate-800" x-text="pricing({pricing_method: 'fixed', price: tier.price, billing_unit: details.billing_unit})"></dd></div></template>
          </dl>
        </div>
      </section>
      <section aria-labelledby="clinic-service-notes-heading">
        <h4 id="clinic-service-notes-heading" class="mb-2 text-sm font-bold text-[#355674]">Service Notes</h4>
        <p class="whitespace-pre-wrap break-words text-sm text-slate-700" x-text="details.notes || 'No service notes added.'"></p>
      </section>
    </div>
  </template>
  <footer class="flex justify-end border-t border-slate-200 px-6 py-4"><button type="button" @click="closeDetails()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Close</button></footer>
</dialog>
