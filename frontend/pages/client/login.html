<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css" />
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-8">
      <div class="p-8 md:p-4">
        <div class="mb-6 text-center">
          <h2 class="text-2xl font-bold text-gray-800">Customer Login</h2>
          <p class="text-gray-500 text-sm mt-1">
            Please enter your mobile number and password.
          </p>
        </div>

        <!--
          BACKEND HANDOFF:
          This form is wired to a temporary frontend login flow. Connect it to the
          real customer authentication endpoint, return validation errors near the
          form fields, and let the backend own remember-me, forgot-password, and
          post-login session handling.
        -->
        <form id="customerLoginForm" class="space-y-5">
          <div>
            <label
              for="phone"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Mobile Number
            </label>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              maxlength="11"
              pattern="09[0-9]{9}"
              title="Enter a valid 11-digit mobile number starting with 09"
              placeholder="09XXXXXXXXX"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#315b7e]"
              required
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#315b7e]"
              required
            />
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-gray-600">
              <input type="checkbox" />
              Remember me
            </label>

            <a href="#" class="text-[#315b7e] hover:underline">
              Forgot password?
            </a>
          </div>

          <button
            type="submit"
            class="w-full bg-[#315b7e] text-white py-3 rounded-xl font-semibold hover:bg-[#254561] transition-colors"
          >
            Log In
          </button>
        </form>

        <p class="text-sm text-gray-600 mt-6 text-center">
          Don’t have an account?
          <a
            href="./signup.html"
            class="text-[#315b7e] font-semibold hover:underline"
          >
            Sign Up
          </a>
        </p>

        <div class="mt-6 text-center">
          <a
            href="../../index.html"
            class="text-sm text-gray-500 hover:text-[#315b7e]"
          >
            ← Back to Home
          </a>
        </div>
      </div>
    </div>

    <script src="../../scripts/api.js"></script>
    <script src="../../scripts/auth/client/login.js"></script>
  </body>
</html>
